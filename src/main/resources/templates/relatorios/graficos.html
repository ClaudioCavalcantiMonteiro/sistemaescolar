<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gráficos de Evolução</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home"><i class="bi bi-house"></i> Início</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Gráficos de Evolução do Aluno</h1>
    <p>Selecione um aluno e uma matéria para visualizar a evolução das notas ao longo das 4 unidades.</p>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <label class="form-label">Aluno</label>
            <select id="alunoSelect" class="form-select">
                <option value="">Selecione</option>
                <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Matéria</label>
            <select id="materiaSelect" class="form-select">
                <option value="">Selecione</option>
                <option th:each="materia : ${materias}" th:value="${materia.id}" th:text="${materia.nome}"></option>
            </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-primary w-100" onclick="carregarGrafico()">
                <i class="bi bi-bar-chart"></i> Gerar Gráfico
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <canvas id="grafico" width="400" height="200"></canvas>
        </div>
    </div>

    <div class="mt-3">
        <a href="/home" class="btn btn-secondary">Voltar</a>
    </div>
</div>

<script>
    let chartInstance = null;

    function carregarGrafico() {
        const alunoId = document.getElementById('alunoSelect').value;
        const materiaId = document.getElementById('materiaSelect').value;

        if (!alunoId || !materiaId) {
            alert('Por favor, selecione um aluno e uma matéria.');
            return;
        }

        fetch('/relatorios/api/evolucao/' + alunoId + '/' + materiaId)
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('grafico').getContext('2d');
                if (chartInstance) {
                    chartInstance.destroy();
                }
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.unidades,
                        datasets: [{
                            label: 'Média Final por Unidade',
                            data: data.medias,
                            borderColor: '#4a6fa5',
                            backgroundColor: 'rgba(74, 111, 165, 0.1)',
                            tension: 0.2,
                            pointBackgroundColor: '#4a6fa5',
                            pointRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 10,
                                title: {
                                    display: true,
                                    text: 'Nota'
                                }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return 'Média: ' + context.raw.toFixed(1);
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(error => {
                alert('Erro ao carregar dados: ' + error);
            });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
