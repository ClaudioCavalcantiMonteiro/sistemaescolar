<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos de Evolução</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .container { max-width: 100%; }
            .card { box-shadow: none !important; border: none !important; }
            .grafico-container { page-break-inside: avoid; }
        }
        .grafico-container {
            position: relative;
            height: 450px;
            width: 100%;
        }
        .page-header {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/home"><i class="bi bi-house"></i> Início</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="page-header">
        <h1 class="mb-1"><i class="bi bi-bar-chart-line"></i> Gráficos de Evolução do Aluno</h1>
        <p class="mb-0 opacity-75">Selecione uma série, um aluno e veja a evolução por matéria individual ou todas juntas.</p>
    </div>

    <!-- Filtros -->
    <div class="card shadow-sm mb-4 no-print">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-book-fill text-info"></i> Série
                    </label>
                    <select id="serieSelect" class="form-select" onchange="carregarAlunosPorSerie()">
                        <option value="">Todas as séries</option>
                        <option th:each="serie : ${series}" th:value="${serie.id}" th:text="${serie.nome}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-person-fill text-primary"></i> Aluno
                    </label>
                    <select id="alunoSelect" class="form-select">
                        <option value="">Selecione uma série primeiro</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">
                        <i class="bi bi-journal-bookmark-fill text-success"></i> Matéria
                    </label>
                    <select id="materiaSelect" class="form-select">
                        <option value="">Selecione uma matéria</option>
                        <option value="GERAL" class="fw-bold text-primary">📊 TODAS AS MATÉRIAS</option>
                        <option th:each="materia : ${materias}" th:value="${materia.id}" th:text="${materia.nome}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="carregarGrafico()">
                        <i class="bi bi-graph-up"></i> Gerar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Área do gráfico -->
    <div class="card shadow-sm">
        <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
            <h5 class="mb-0" id="tituloGrafico">
                <i class="bi bi-bar-chart"></i> Selecione uma série, um aluno e uma matéria
            </h5>
            <button class="btn btn-sm btn-outline-primary no-print" onclick="imprimirGrafico()">
                <i class="bi bi-printer"></i> Imprimir
            </button>
        </div>
        <div class="card-body">
            <div class="grafico-container">
                <canvas id="graficoEvolucao"></canvas>
            </div>
            <div id="mensagemVazia" class="text-center py-5 d-none">
                <i class="bi bi-info-circle display-4 text-muted"></i>
                <p class="text-muted mt-2">Nenhuma nota encontrada para esta seleção.</p>
            </div>
        </div>
    </div>

    <div class="mt-3 no-print">
        <a href="/home" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
</div>

<script>
    let chartInstance = null;

    // Carrega alunos conforme a série selecionada
    function carregarAlunosPorSerie() {
        const serieId = document.getElementById('serieSelect').value;
        const alunoSelect = document.getElementById('alunoSelect');

        alunoSelect.innerHTML = '<option value="">Carregando...</option>';

        if (!serieId) {
            alunoSelect.innerHTML = '<option value="">Selecione uma série primeiro</option>';
            return;
        }

        fetch(`/relatorios/api/alunos-por-serie/${serieId}`)
            .then(r => r.json())
            .then(alunos => {
                if (alunos.length === 0) {
                    alunoSelect.innerHTML = '<option value="">Nenhum aluno nesta série</option>';
                    return;
                }
                alunoSelect.innerHTML = '<option value="">Selecione um aluno</option>';
                alunos.forEach(a => {
                    const opt = document.createElement('option');
                    opt.value = a.id;
                    opt.textContent = a.nome;
                    alunoSelect.appendChild(opt);
                });
            })
            .catch(err => {
                alunoSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                alert('Erro: ' + err);
            });
    }

    function carregarGrafico() {
        const alunoId = document.getElementById('alunoSelect').value;
        const materiaId = document.getElementById('materiaSelect').value;

        if (!alunoId || !materiaId) {
            alert('Selecione um aluno e uma matéria.');
            return;
        }

        if (materiaId === 'GERAL') {
            carregarGraficoGeral(alunoId);
        } else {
            carregarGraficoIndividual(alunoId, materiaId);
        }
    }

    function carregarGraficoIndividual(alunoId, materiaId) {
        const materiaNome = document.getElementById('materiaSelect').selectedOptions[0].text;
        const alunoNome = document.getElementById('alunoSelect').selectedOptions[0].text;

        fetch(`/relatorios/api/evolucao/${alunoId}/${materiaId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('tituloGrafico').innerHTML =
                    `<i class="bi bi-person-circle"></i> ${alunoNome} — <span class="text-primary">${materiaNome}</span>`;

                const temNotas = data.medias.some(m => m > 0);
                if (!temNotas) {
                    document.getElementById('mensagemVazia').classList.remove('d-none');
                } else {
                    document.getElementById('mensagemVazia').classList.add('d-none');
                }

                const ctx = document.getElementById('graficoEvolucao').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: materiaNome,
                            data: data.medias,
                            borderColor: '#4a6fa5',
                            backgroundColor: 'rgba(74, 111, 165, 0.15)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#4a6fa5',
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }]
                    },
                    options: opcoesGrafico()
                });
            })
            .catch(err => alert('Erro: ' + err));
    }

    function carregarGraficoGeral(alunoId) {
        const alunoNome = document.getElementById('alunoSelect').selectedOptions[0].text;

        fetch(`/relatorios/api/evolucao-geral/${alunoId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('tituloGrafico').innerHTML =
                    `<i class="bi bi-person-circle"></i> ${alunoNome} — <span class="text-primary">Todas as Matérias</span>`;

                if (!data.datasets || data.datasets.length === 0) {
                    document.getElementById('mensagemVazia').classList.remove('d-none');
                    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
                    return;
                }

                document.getElementById('mensagemVazia').classList.add('d-none');

                const ctx = document.getElementById('graficoEvolucao').getContext('2d');
                if (chartInstance) chartInstance.destroy();

                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: data.datasets
                    },
                    options: opcoesGrafico()
                });
            })
            .catch(err => alert('Erro: ' + err));
    }

    function opcoesGrafico() {
        return {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 500 },
            interaction: {
                mode: 'index',
                intersect: false
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 10,
                    ticks: { stepSize: 2 },
                    title: { display: true, text: 'Média' }
                }
            },
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                    labels: { boxWidth: 20, padding: 10, font: { size: 11 } }
                },
                tooltip: {
                    callbacks: {
                        label: (ctx) => ctx.dataset.label + ': ' + (ctx.raw !== null ? ctx.raw.toFixed(1) : '-')
                    }
                }
            }
        };
    }

    function imprimirGrafico() {
        window.print();
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
