<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Série</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <h1>Cadastrar/Editar Série</h1>
    <form th:action="@{/series/salvar}" th:object="${serie}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" class="form-control" th:field="*{descricao}">
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/series" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
