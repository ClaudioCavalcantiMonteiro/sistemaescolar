<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista de Séries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Séries</h1>
    <a href="/series/novo" class="btn btn-primary mb-3">Nova Série</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="serie : ${series}">
                <td th:text="${serie.id}"></td>
                <td th:text="${serie.nome}"></td>
                <td th:text="${serie.descricao}"></td>
                <td>
                    <a th:href="@{/series/editar/{id}(id=${serie.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/series/excluir/{id}(id=${serie.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirma exclusão?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/home" class="btn btn-secondary">Voltar</a>
</body>
</html>
