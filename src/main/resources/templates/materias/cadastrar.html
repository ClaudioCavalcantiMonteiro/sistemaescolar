<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Matéria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .form-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 32px; max-width: 600px; margin: 0 auto;
        }
        .form-card h1 { font-size: 1.4rem; font-weight: 700; color: #2c3e50; margin-bottom: 24px; }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .user-info {
            background: rgba(255,255,255,0.15);
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.82rem;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .navbar .btn-outline-light { border-radius: 20px; padding: 4px 14px; font-size: 0.82rem; font-weight: 600; }
        .navbar .nav-link { font-size: 0.92rem; padding-left: 0.6rem !important; padding-right: 0.6rem !important; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">
    <div class="form-card">
        <h1><i class="bi bi-journal text-success"></i>
            <span th:if="${materia.id == null}">Nova Matéria</span>
            <span th:if="${materia.id != null}">Editar Matéria</span>
        </h1>

        <div th:if="${param.erroDuplicado}" class="alert alert-warning">
            <i class="bi bi-exclamation-triangle"></i>
            <strong>Matéria já existe!</strong> Escolha outro nome.
        </div>

        <form th:action="@{/materias/salvar}" th:object="${materia}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-4">
                <label class="form-label">Nome da Matéria</label>
                <input type="text" class="form-control" th:field="*{nome}" required
                       placeholder="Ex: Matemática, Português, História">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar</button>
                <a href="/materias" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
