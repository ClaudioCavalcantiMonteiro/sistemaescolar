<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Carnê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .form-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 32px; max-width: 700px;
            margin: 0 auto;
        }
        .form-card h1 { font-size: 1.4rem; font-weight: 700; color: #1e40af; margin-bottom: 8px; }
        .form-card .sub { color: #6c757d; margin-bottom: 24px; font-size: 0.9rem; }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .info-box {
            background: #e8f4ea; border-left: 4px solid #27ae60;
            padding: 12px 16px; border-radius: 8px;
            font-size: 0.88rem; color: #186a3b; margin-bottom: 24px;
        }
        .tipo-card {
            background: #f8fafc; border: 2px solid #e2e8f0;
            border-radius: 10px; padding: 16px;
            cursor: pointer; transition: all 0.2s;
            margin-bottom: 10px;
        }
        .tipo-card:hover { border-color: #1e40af; background: #f0f4f8; }
        .tipo-card.ativo { border-color: #1e40af; background: #e8eef5; }
        .tipo-card input[type="radio"] { margin-right: 8px; }
        .tipo-card label { cursor: pointer; margin: 0; font-weight: 600; color: #1e40af; }
        .badge-count {
            background: #e8eef5; color: #1e40af;
            font-size: 0.75rem; padding: 2px 8px;
            border-radius: 10px; margin-left: 8px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">
    <div class="form-card">

        <h1><i class="bi bi-receipt-cutoff text-primary"></i> Gerar Carnê de Mensalidades</h1>
        <p class="sub">Escolha o período e o tipo de geração. O PDF sai no formato A4 com 6 talões por folha.</p>

        <div class="info-box">
            <i class="bi bi-info-circle-fill"></i>
            Cada folha A4 contém <strong>6 talões</strong> com picote (entre e no final).
            Escolha o mês inicial e final para gerar apenas os meses desejados.
        </div>

        <form th:action="@{/financeiro/carne/pdf}" method="get" target="_blank">

            <!-- Tipo: Individual ou Turma -->
            <div class="mb-4">
                <label class="form-label d-block mb-2">
                    <i class="bi bi-people"></i> Tipo de geração
                </label>

                <div class="tipo-card ativo" onclick="selecionarTipo('individual')">
                    <label onclick="event.stopPropagation(); selecionarTipo('individual');">
                        <input type="radio" name="tipo" value="individual" id="radioIndividual" checked>
                        <i class="bi bi-person-circle"></i> Aluno Individual
                    </label>
                </div>

                <div class="tipo-card" onclick="selecionarTipo('turma')">
                    <label onclick="event.stopPropagation(); selecionarTipo('turma');">
                        <input type="radio" name="tipo" value="turma" id="radioTurma">
                        <i class="bi bi-people-fill"></i> Turma Inteira
                    </label>
                </div>
            </div>

            <!-- ========== ÁREA DO ALUNO INDIVIDUAL ========== -->
            <div id="campoAluno">

                <!-- Série (filtro) -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-bookmark"></i> Série (filtro)
                    </label>
                    <select id="selectSerie" class="form-select">
                        <option value="">Todas as séries</option>
                        <option th:each="s : ${series}"
                                th:value="${s.id}"
                                th:text="${s.nome}">
                        </option>
                    </select>
                </div>

                <!-- Aluno -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person"></i> Aluno
                        <span class="badge-count" id="badgeCount">0</span>
                    </label>
                    <select name="alunoId" class="form-select" id="selectAluno">
                        <option value="">Selecione um aluno</option>
                        <option th:each="a : ${alunos}"
                                th:value="${a.id}"
                                th:data-serie="${a.serie != null ? a.serie.id : ''}"
                                th:text="${a.nome} + (${a.turma != null} ? ' — ' + ${a.turma.nome} : '')"
                                th:selected="${alunoId != null and alunoId == a.id}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Turma -->
            <div class="mb-3" id="campoTurma" style="display:none;">
                <label class="form-label"><i class="bi bi-people"></i> Turma</label>
                <select name="turmaId" class="form-select" id="selectTurma">
                    <option value="">Selecione uma turma</option>
                    <option th:each="t : ${turmas}"
                            th:value="${t.id}"
                            th:text="${t.nome}"
                            th:selected="${turmaId != null and turmaId == t.id}">
                    </option>
                </select>
            </div>

            <!-- Período -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label"><i class="bi bi-calendar"></i> Mês Inicial</label>
                    <select name="mesInicio" class="form-select" required>
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8" th:selected="${mesAtual == 8}">Agosto</option>
                        <option value="9" th:selected="${mesAtual == 9}">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label"><i class="bi bi-calendar"></i> Mês Final</label>
                    <select name="mesFim" class="form-select" required>
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11" th:selected="${mesAtual <= 11}">Novembro</option>
                        <option value="12" th:selected="${mesAtual == 12}">Dezembro</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label"><i class="bi bi-calendar-event"></i> Ano</label>
                    <input type="number" name="ano" class="form-control"
                           th:value="${ano}" min="2020" max="2100" required>
                </div>
            </div>

            <!-- Botões -->
            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-file-earmark-pdf-fill"></i> Gerar Carnê PDF
                </button>
                <a href="/financeiro/mensalidades" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ========== FILTRO DE ALUNOS POR SÉRIE ==========
    function filtrarAlunosPorSerie() {
        const selectAluno = document.getElementById('selectAluno');
        const serieId = document.getElementById('selectSerie').value;

        let visiveis = 0;

        // Reseta o select para a primeira opção (placeholder)
        selectAluno.value = '';

        const options = selectAluno.querySelectorAll('option');
        options.forEach((opt, idx) => {
            if (idx === 0) return; // Pula o "Selecione um aluno"

            const optSerie = opt.getAttribute('data-serie') || '';
            const match = !serieId || optSerie === serieId;

            if (match) {
                opt.style.display = '';
                opt.disabled = false;
                visiveis++;
            } else {
                opt.style.display = 'none';
                opt.disabled = true;
            }
        });

        document.getElementById('badgeCount').textContent = visiveis;
    }

    // ========== TIPO (Individual / Turma) ==========
    function selecionarTipo(tipo) {
        const cards = document.querySelectorAll('.tipo-card');
        cards.forEach(c => c.classList.remove('ativo'));

        if (tipo === 'individual') {
            cards[0].classList.add('ativo');
            document.getElementById('radioIndividual').checked = true;
            document.getElementById('campoAluno').style.display = 'block';
            document.getElementById('campoTurma').style.display = 'none';
            document.getElementById('selectAluno').required = true;
            document.getElementById('selectTurma').required = false;
        } else {
            cards[1].classList.add('ativo');
            document.getElementById('radioTurma').checked = true;
            document.getElementById('campoAluno').style.display = 'none';
            document.getElementById('campoTurma').style.display = 'block';
            document.getElementById('selectAluno').required = false;
            document.getElementById('selectTurma').required = true;
        }
    }

    // ========== INICIALIZAÇÃO ==========
    document.addEventListener('DOMContentLoaded', function() {
        // Listener do filtro de série
        document.getElementById('selectSerie').addEventListener('change', filtrarAlunosPorSerie);

        // Se veio com turmaId da URL, seleciona automaticamente turma
        const selectTurma = document.getElementById('selectTurma');
        if (selectTurma && selectTurma.value) {
            selecionarTipo('turma');
        } else {
            selecionarTipo('individual');
            filtrarAlunosPorSerie();
        }
    });
</script>

</body>
</html>
