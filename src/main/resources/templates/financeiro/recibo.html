<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recibo de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f5f7fa; padding: 20px; }
        .recibo {
            background: white; border-radius: 14px;
            padding: 40px; max-width: 700px; margin: 0 auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .recibo-header {
            border-bottom: 2px solid #4a6fa5;
            padding-bottom: 20px; margin-bottom: 24px;
        }
        .recibo-header h1 { color: #2c3e50; font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .recibo-header p { color: #6c757d; margin: 0; font-size: 0.9rem; }
        .valor-destaque {
            background: #e8f4ea; border-radius: 10px;
            padding: 20px; text-align: center;
            border: 2px dashed #27ae60; margin: 24px 0;
        }
        .valor-destaque .valor {
            font-size: 2.2rem; font-weight: 700;
            color: #186a3b; line-height: 1.2;
        }
        .valor-destaque .label { color: #6c757d; font-size: 0.85rem; text-transform: uppercase; font-weight: 600; }
        .linha-info { padding: 8px 0; border-bottom: 1px solid #f0f4fa; }
        .linha-info strong { color: #495057; display: inline-block; width: 180px; }
        .assinatura {
            margin-top: 60px; border-top: 1px solid #2c3e50;
            width: 300px; margin-left: auto; margin-right: auto;
            text-align: center; padding-top: 8px;
            color: #6c757d; font-size: 0.85rem;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .recibo { box-shadow: none; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-3 no-print">
        <button class="btn btn-primary" onclick="window.print()">
            <i class="bi bi-printer"></i> Imprimir Recibo
        </button>
        <a href="/financeiro/mensalidades" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="recibo">
        <div class="recibo-header">
            <h1><i class="bi bi-mortarboard-fill"></i> SISTEMA ESCOLAR</h1>
            <p>Recibo de Pagamento de Mensalidade</p>
        </div>

        <div class="linha-info">
            <strong>Recibo Nº:</strong>
            <span th:text="${#numbers.formatInteger(mensalidade.id, 6)}"></span>
        </div>
        <div class="linha-info">
            <strong>Aluno:</strong>
            <span th:text="${aluno.nome}"></span>
        </div>
        <div class="linha-info">
            <strong>Série:</strong>
            <span th:text="${aluno.serie != null ? aluno.serie.nome : '-'}"></span>
        </div>
        <div class="linha-info">
            <strong>Turma:</strong>
            <span th:text="${aluno.turma != null ? aluno.turma.nome : '-'}"></span>
        </div>
        <div class="linha-info">
            <strong>Responsável:</strong>
            <span th:text="${aluno.responsavelFinanceiro != null ? aluno.responsavelFinanceiro.nome : '-'}"></span>
        </div>
        <div class="linha-info">
            <strong>Mês de Referência:</strong>
            <span th:text="${#temporals.format(mensalidade.mesReferencia, 'MM/yyyy')}"></span>
        </div>
        <div class="linha-info">
            <strong>Data do Pagamento:</strong>
            <span th:text="${#temporals.format(mensalidade.dataPagamento, 'dd/MM/yyyy')}"></span>
        </div>
        <div class="linha-info">
            <strong>Forma de Pagamento:</strong>
            <span th:text="${mensalidade.formaPagamento}"></span>
        </div>

        <div th:if="${mensalidade.desconto != null and mensalidade.desconto > 0}" class="linha-info">
            <strong>Desconto:</strong>
            <span class="text-success"
                  th:text="'- R$ ' + ${#numbers.formatDecimal(mensalidade.desconto, 1, 2)}"></span>
        </div>
        <div th:if="${mensalidade.juros != null and mensalidade.juros > 0}" class="linha-info">
            <strong>Juros:</strong>
            <span class="text-danger"
                  th:text="'+ R$ ' + ${#numbers.formatDecimal(mensalidade.juros, 1, 2)}"></span>
        </div>

        <div class="valor-destaque">
            <div class="label">Valor Recebido</div>
            <div class="valor" th:text="'R$ ' + ${#numbers.formatDecimal(mensalidade.valorPago, 1, 2)}">R$ 0,00</div>
        </div>

        <div th:if="${mensalidade.observacao != null and !mensalidade.observacao.isEmpty()}"
             class="linha-info">
            <strong>Observação:</strong>
            <span th:text="${mensalidade.observacao}"></span>
        </div>

        <p style="margin-top: 30px; color: #6c757d; font-size: 0.9rem;">
            Emitido em:
            <span th:text="${#temporals.format(#temporals.createToday(), 'dd/MM/yyyy')}"></span>
        </p>

        <div class="assinatura">
            Assinatura do Responsável pela Emissão
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
