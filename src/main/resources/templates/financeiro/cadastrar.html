<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Mensalidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .form-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 32px; max-width: 700px;
            width: 100%; margin: 0 auto;
        }
        .form-card h1 { font-size: 1.4rem; font-weight: 700; color: #1e40af; margin-bottom: 24px; }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .filtro-box {
            background: #f8fafc;
            border: 1px solid #e5e9f0;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .filtro-box .form-label { font-size: 0.8rem; color: #6c757d; }

        @media (max-width: 768px) {
            .form-card { padding: 20px; border-radius: 12px; margin: 0 4px; }
            .form-card h1 { font-size: 1.15rem; margin-bottom: 18px; }
            .form-label { font-size: 0.85rem; }
            .filtro-box { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- Navbar padronizada -->
<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">
    <div class="form-card">
        <h1><i class="bi bi-cash-coin text-success"></i> Nova Mensalidade</h1>

        <form th:action="@{/financeiro/salvar}" method="post">

            <!-- FILTROS DE SÉRIE E TURMA -->
            <div class="filtro-box">
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-book"></i> Filtrar por Série</label>
                        <select id="filtroSerie" class="form-select form-select-sm">
                            <option value="">Todas as séries</option>
                            <option th:each="s : ${series}" th:value="${s.id}" th:text="${s.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-people"></i> Filtrar por Turma</label>
                        <select id="filtroTurma" class="form-select form-select-sm">
                            <option value="">Todas as turmas</option>
                            <option th:each="t : ${turmas}"
                                    th:value="${t.id}"
                                    th:text="${t.nome}"
                                    th:attr="data-serie-id=${t.serie != null ? t.serie.id : ''}"></option>
                        </select>
                    </div>
                </div>
                <small class="text-muted d-block mt-2">
                    <i class="bi bi-info-circle"></i> Use os filtros acima para encontrar o aluno mais rápido.
                </small>
            </div>

            <!-- SELECT DE ALUNOS -->
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person"></i> Aluno</label>
                <select name="alunoId" id="selectAluno" class="form-select" required>
                    <option value="">Selecione um aluno</option>
                    <option th:each="a : ${alunos}"
                            th:value="${a.id}"
                            th:text="${a.nome} + (${a.turma != null} ? ' (' + ${a.turma.nome} + ')' : '')"
                            th:attr="data-serie-id=${a.serie != null ? a.serie.id : ''},
                                     data-turma-id=${a.turma != null ? a.turma.id : ''}">
                    </option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="bi bi-calendar"></i> Mês de Referência</label>
                    <input type="month" name="mesReferencia" class="form-control"
                           th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM')}" required>
                    <small class="text-muted">Vai virar o primeiro dia do mês.</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="bi bi-calendar-event"></i> Data de Vencimento</label>
                    <input type="date" name="dataVencimento" class="form-control"
                           th:value="${#temporals.format(#temporals.createToday().withDayOfMonth(10), 'yyyy-MM-dd')}"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="bi bi-currency-dollar"></i> Valor (R$)</label>
                <input type="number" name="valorOriginal" class="form-control"
                       step="0.01" min="0" placeholder="0.00" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-chat"></i> Observação (opcional)</label>
                <input type="text" name="observacao" class="form-control" placeholder="Ex: Bolsa de 50%">
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar</button>
                <a href="/financeiro/mensalidades" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // FILTRO DINÂMICO DE ALUNOS POR SÉRIE E TURMA
    document.addEventListener('DOMContentLoaded', function() {
        const filtroSerie = document.getElementById('filtroSerie');
        const filtroTurma = document.getElementById('filtroTurma');
        const selectAluno = document.getElementById('selectAluno');
        const todasOpcoesAluno = Array.from(selectAluno.querySelectorAll('option'));
        const todasOpcoesTurma = Array.from(filtroTurma.querySelectorAll('option'));

        function aplicarFiltros() {
            const serieId = filtroSerie.value;
            const turmaId = filtroTurma.value;

            todasOpcoesTurma.forEach(function(opt, i) {
                if (i === 0) return;
                const serieDaTurma = opt.getAttribute('data-serie-id');
                const deveMostrar = !serieId || serieDaTurma === serieId;
                opt.style.display = deveMostrar ? '' : 'none';
                opt.disabled = !deveMostrar;

                if (!deveMostrar && opt.value === turmaId) {
                    filtroTurma.value = '';
                }
            });

            const turmaIdEfetiva = filtroTurma.value;

            todasOpcoesAluno.forEach(function(opt) {
                if (opt.value === '') return;
                const serieDoAluno = opt.getAttribute('data-serie-id');
                const turmaDoAluno = opt.getAttribute('data-turma-id');

                const matchSerie = !serieId || serieDoAluno === serieId;
                const matchTurma = !turmaIdEfetiva || turmaDoAluno === turmaIdEfetiva;

                const deveMostrar = matchSerie && matchTurma;
                opt.style.display = deveMostrar ? '' : 'none';
                opt.disabled = !deveMostrar;
            });

            const opcaoAtual = selectAluno.options[selectAluno.selectedIndex];
            if (opcaoAtual && opcaoAtual.value && opcaoAtual.disabled) {
                selectAluno.value = '';
            }
        }

        filtroSerie.addEventListener('change', aplicarFiltros);
        filtroTurma.addEventListener('change', aplicarFiltros);
    });
</script>

</body>
</html>
