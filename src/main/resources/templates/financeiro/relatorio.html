<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Relatório Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .filter-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 20px; margin-bottom: 20px;
        }
        .stat-card {
            background: white; border-radius: 14px;
            padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-left: 4px solid; text-align: center;
        }
        .stat-card .v { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
        .stat-card .l {
            font-size: 0.72rem; color: #6c757d;
            text-transform: uppercase; font-weight: 600;
            margin-top: 4px; letter-spacing: 0.5px;
        }
        .table-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .table thead th {
            background: #f8fafc; color: #6c757d;
            font-size: 0.75rem; text-transform: uppercase;
            font-weight: 600; border-bottom: 2px solid #e5e9f0;
        }
        .badge-status {
            padding: 4px 10px; border-radius: 12px;
            font-size: 0.68rem; font-weight: 700;
        }
        .badge-PAGA { background: #d1e7dd; color: #0f5132; }
        .badge-PENDENTE { background: #fff3cd; color: #856404; }
        .badge-ATRASADA { background: #f8d7da; color: #842029; }
        .badge-CANCELADA { background: #e2e3e5; color: #41464b; }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/financeiro"><i class="bi bi-arrow-left"></i> Voltar</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 pb-5">
    <div class="text-center mb-4 d-none d-print-block">
        <h2>Relatório Financeiro</h2>
        <hr>
    </div>

    <h1 class="h3 mb-3 no-print"><i class="bi bi-file-earmark-bar-graph text-primary"></i> Relatório Financeiro</h1>

    <!-- Filtros -->
    <div class="filter-card no-print">
        <form th:action="@{/financeiro/relatorio}" method="get">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold text-muted">Mês</label>
                    <select name="mes" class="form-select">
                        <option value="1" th:selected="${mes == 1}">Janeiro</option>
                        <option value="2" th:selected="${mes == 2}">Fevereiro</option>
                        <option value="3" th:selected="${mes == 3}">Março</option>
                        <option value="4" th:selected="${mes == 4}">Abril</option>
                        <option value="5" th:selected="${mes == 5}">Maio</option>
                        <option value="6" th:selected="${mes == 6}">Junho</option>
                        <option value="7" th:selected="${mes == 7}">Julho</option>
                        <option value="8" th:selected="${mes == 8}">Agosto</option>
                        <option value="9" th:selected="${mes == 9}">Setembro</option>
                        <option value="10" th:selected="${mes == 10}">Outubro</option>
                        <option value="11" th:selected="${mes == 11}">Novembro</option>
                        <option value="12" th:selected="${mes == 12}">Dezembro</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold text-muted">Ano</label>
                    <input type="number" name="ano" class="form-control" th:value="${ano}" min="2020" max="2100">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">Turma</label>
                    <select name="turmaId" class="form-select">
                        <option value="">Todas as turmas</option>
                        <option th:each="t : ${turmas}" th:value="${t.id}" th:text="${t.nome}"
                                th:selected="${turmaId != null and turmaId == t.id}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-search"></i> Gerar
                    </button>
                    <button type="button" class="btn btn-outline-primary" onclick="window.print()">
                        <i class="bi bi-printer"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Estatísticas -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="stat-card" style="border-color: #4a6fa5;">
                <div class="v text-primary"
                     th:text="'R$ ' + ${#numbers.formatDecimal(estatisticas.totalPrevisto, 1, 2)}">R$ 0,00</div>
                <div class="l">Total Previsto</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card" style="border-color: #198754;">
                <div class="v text-success"
                     th:text="'R$ ' + ${#numbers.formatDecimal(estatisticas.totalRecebido, 1, 2)}">R$ 0,00</div>
                <div class="l">Total Recebido</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card" style="border-color: #dc3545;">
                <div class="v text-danger"
                     th:text="'R$ ' + ${#numbers.formatDecimal(estatisticas.totalAtrasado, 1, 2)}">R$ 0,00</div>
                <div class="l">Em Atraso</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card" style="border-color: #f39c12;">
                <div class="v text-warning"
                     th:text="${estatisticas.qtdPagas} + ' / ' + ${estatisticas.total}">0 / 0</div>
                <div class="l">Pagas / Total</div>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Turma</th>
                        <th>Referência</th>
                        <th>Vencimento</th>
                        <th>Pagamento</th>
                        <th class="text-end">Valor</th>
                        <th class="text-center">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${mensalidades}">
                        <td th:text="${m.aluno != null ? m.aluno.nome : '-'}"></td>
                        <td th:text="${m.aluno != null and m.aluno.turma != null ? m.aluno.turma.nome : '-'}"></td>
                        <td th:text="${#temporals.format(m.mesReferencia, 'MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(m.dataVencimento, 'dd/MM/yyyy')}"></td>
                        <td th:text="${m.dataPagamento != null ? #temporals.format(m.dataPagamento, 'dd/MM/yyyy') : '-'}"></td>
                        <td class="text-end fw-bold"
                            th:text="'R$ ' + ${#numbers.formatDecimal(m.paga ? m.valorPago : m.valorTotal, 1, 2)}"></td>
                        <td class="text-center">
                            <span th:if="${m.paga}" class="badge-status badge-PAGA">Paga</span>
                            <span th:if="${m.atrasada}" class="badge-status badge-ATRASADA">Atrasada</span>
                            <span th:if="${!m.paga and !m.atrasada and !m.cancelada}" class="badge-status badge-PENDENTE">Pendente</span>
                            <span th:if="${m.cancelada}" class="badge-status badge-CANCELADA">Cancelada</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(mensalidades)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            Nenhuma mensalidade para o período.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3 no-print">
        <a href="/financeiro" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
