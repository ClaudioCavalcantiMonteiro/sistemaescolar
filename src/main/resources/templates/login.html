<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6f0fa 0%, #d4e2f2 100%);
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(58,86,130,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand h1 {
            font-size: 26px; font-weight: 700;
            color: #1a2a3a; margin-bottom: 2px;
        }
        .brand h2 {
            font-size: 13px; font-weight: 600;
            color: #4a6fa5; letter-spacing: 3px;
            text-transform: uppercase; opacity: 0.7;
        }
        .welcome { text-align: center; margin-bottom: 28px; }
        .welcome h3 {
            font-size: 20px; font-weight: 600;
            color: #1a2a3a; margin-bottom: 2px;
        }
        .welcome p { font-size: 15px; color: #5a6a7a; margin: 0; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 13px;
            font-weight: 500; color: #1a2a3a; margin-bottom: 5px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #dce5ef;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            background: rgba(255,255,255,0.7);
            transition: all 0.2s ease;
            color: #1a2a3a;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #4a6fa5;
            background: white;
            box-shadow: 0 4px 12px rgba(74,111,165,0.12);
        }
        .input-wrapper input:-webkit-autofill,
        .input-wrapper input:-webkit-autofill:hover,
        .input-wrapper input:-webkit-autofill:focus {
            -webkit-text-fill-color: #1a2a3a;
            -webkit-box-shadow: 0 0 0px 1000px white inset;
            transition: background-color 5000s ease-in-out 0s;
        }
        .actions { display: flex; margin-top: 6px; }
        .btn {
            flex: 1;
            padding: 14px 12px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #4a6fa5; color: white;
            box-shadow: 0 4px 12px rgba(74,111,165,0.25);
        }
        .btn-primary:hover {
            background: #3a5a8a;
            transform: translateY(-1px);
        }
        .feedback {
            margin-top: 20px; text-align: center;
            font-size: 14px; font-weight: 500;
            padding: 10px; border-radius: 10px;
        }
        .feedback.error { color: #d32f2f; background: #fde8e8; }
        .feedback.success { color: #2e7d32; background: #e8f5e9; }
        .feedback.warning { color: #856404; background: #fff3cd; }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #8a9aae;
            border-top: 1px solid #e5e9f0;
            padding-top: 16px;
        }
        .footer-note i { color: #4a6fa5; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <h1>SISTEMA ESCOLAR</h1>
        <h2>LOGIN</h2>
    </div>

    <div class="welcome">
        <h3>Bem vindo de volta!</h3>
        <p>Acesse sua conta</p>
    </div>

    <form action="/login" method="post" autocomplete="off" id="loginForm">
        <!-- Honeypot inputs -->
        <input type="text" name="fakeusernameremembered" style="display:none;" tabindex="-1" autocomplete="off">
        <input type="password" name="fakepasswordremembered" style="display:none;" tabindex="-1" autocomplete="off">

        <div class="form-group">
            <label for="username">Nome de usuário</label>
            <div class="input-wrapper">
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Digite seu email"
                       autocomplete="off"
                       autocapitalize="off"
                       autocorrect="off"
                       spellcheck="false"
                       readonly
                       onfocus="this.removeAttribute('readonly');"
                       required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Digite sua senha"
                       autocomplete="new-password"
                       readonly
                       onfocus="this.removeAttribute('readonly');"
                       required>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </div>
    </form>

    <!-- Mensagens de feedback -->
    <div th:if="${param.error}" class="feedback error">
        Usuário ou senha inválidos!
    </div>
    <div th:if="${param.logout}" class="feedback success">
        Você saiu com sucesso.
    </div>
    <div th:if="${param.expired}" class="feedback warning">
        Sessão expirada. Faça login novamente.
    </div>

    <!-- Aviso de acesso restrito -->
    <div class="footer-note">
        <i class="bi bi-shield-lock-fill"></i>
        Acesso restrito a usuários cadastrados pela administração.
    </div>
</div>

<script>
    // Remove autofill após carregar
    window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
            const u = document.getElementById('username');
            const p = document.getElementById('password');
            if (u.value) u.value = '';
            if (p.value) p.value = '';
        }, 150);
    });

    // Remove autofill ao voltar do navegador
    window.addEventListener('pageshow', function () {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u) u.value = '';
        if (p) p.value = '';
    });
</script>

</body>
</html>
