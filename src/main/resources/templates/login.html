<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: 1.5rem;
            border: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .login-card .card-body {
            padding: 2.5rem;
        }
        .login-card .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
        }
        .login-card .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        .login-card .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
        }
        .login-card .btn-primary:hover {
            background-color: #4338ca;
            border-color: #4338ca;
        }
        .login-card .btn-outline-primary {
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
            border-color: #4f46e5;
            color: #4f46e5;
        }
        .login-card .btn-outline-primary:hover {
            background-color: #4f46e5;
            color: #fff;
        }
        .login-card .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-card .brand h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #1e293b;
        }
        .login-card .brand h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4f46e5;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .login-card .welcome {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-card .welcome h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
        }
        .login-card .welcome p {
            color: #64748b;
            margin: 0;
        }
        .login-card .forgot-link {
            text-align: right;
            font-size: 0.85rem;
        }
        .login-card .forgot-link a {
            color: #4f46e5;
            text-decoration: none;
        }
        .login-card .forgot-link a:hover {
            text-decoration: underline;
        }
        .login-card .feedback {
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }
        .login-card .feedback.error {
            color: #dc2626;
        }
        .login-card .feedback.success {
            color: #16a34a;
        }
        .login-card .input-group-text {
            background: transparent;
            border: 0;
            padding: 0 0 0 1rem;
        }
        .login-card .input-group .form-control {
            border-left: 0;
        }
        .login-card .input-group .form-control:focus {
            border-color: #e2e8f0;
            box-shadow: none;
        }
        .login-card .input-group:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-4">
            <div class="card login-card">
                <div class="card-body">
                    <div class="brand">
                        <h1>SISTEMA ESCOLAR</h1>
                        <h2>LOGIN</h2>
                    </div>
                    <div class="welcome">
                        <h3>Bem vindo de volta!</h3>
                        <p>Acesse sua conta</p>
                    </div>

                    <form action="/login" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Nome de usuário</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                            </div>
                        </div>
                        <div class="forgot-link mb-3">
                            <a href="#">Esqueceu sua senha?</a>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">Login</button>
                            <a href="/registro" class="btn btn-outline-primary flex-fill">Inscrever-se</a>
                        </div>
                    </form>

                    <!-- Feedback -->
                    <div th:if="${param.error}" class="feedback error">
                        <i class="bi bi-exclamation-circle"></i> Usuário ou senha inválidos!
                    </div>
                    <div th:if="${param.logout}" class="feedback success">
                        <i class="bi bi-check-circle"></i> Você saiu com sucesso.
                    </div>
                    <div th:if="${param.registroSucesso}" class="feedback success">
                        <i class="bi bi-check-circle"></i> Conta criada! Faça login.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
