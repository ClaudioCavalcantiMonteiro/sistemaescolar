<!DOCTYPE html>
<html>
<head>
	<!-- Bootstrap primeiro -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Depois seu CSS personalizado -->
	<link rel="stylesheet" th:href="@{/style.css}">
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 30px; max-width: 400px; width: 100%; }
        .btn-primary { background: #667eea; border: none; width: 100%; }
        .btn-primary:hover { background: #5a6fd6; }
        .register-link { text-align: center; margin-top: 15px; }
        .error-msg { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-center">SISTEMA ESCOLAR</h1>
        <h2 class="text-center">LOGIN</h2>
        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">Usuário (email)</label>
                <input type="text" class="form-control" name="username" placeholder="Digite seu email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" name="password" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <div class="register-link">
            <a href="/registro">Criar nova conta</a>
        </div>
        <div th:if="${param.error}" class="error-msg">
            Usuário ou senha inválidos!
        </div>
        <div th:if="${param.logout}" class="text-center text-success mt-2">
            Você saiu com sucesso.
        </div>
    </div>
</body>
</html>
