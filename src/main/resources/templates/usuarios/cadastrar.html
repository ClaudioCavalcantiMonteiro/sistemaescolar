<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .form-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 32px; max-width: 600px; margin: 0 auto;
        }
        .form-card h1 {
            font-size: 1.4rem; font-weight: 700;
            color: #2c3e50; margin-bottom: 24px;
        }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .role-info {
            background: #f8fafc; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 20px;
            font-size: 0.85rem; color: #6c757d;
        }
        .role-info strong { color: #4a6fa5; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/usuarios"><i class="bi bi-arrow-left"></i> Voltar</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 pb-5">
    <div class="form-card">
        <h1>
            <i class="bi bi-person-plus-fill text-primary"></i>
            <span th:if="${usuario.id == null}">Novo Usuário</span>
            <span th:if="${usuario.id != null}">Editar Usuário</span>
        </h1>

        <!-- ===== ALERTAS FLASH ===== -->
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <div th:text="${mensagemSucesso}"></div>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div th:text="${mensagemErro}"></div>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>

        <div class="role-info">
            <strong>Perfis disponíveis:</strong><br>
            <i class="bi bi-shield-fill-check text-danger"></i> <strong>ADMIN</strong> – acesso total (inclui gerenciar usuários)<br>
            <i class="bi bi-person-workspace text-info"></i> <strong>PROFESSOR</strong> – lançar/editar notas, ver boletins e relatórios<br>
            <i class="bi bi-clipboard-check text-warning"></i> <strong>SECRETARIA</strong> – cadastros de alunos, séries, turmas, matérias<br>
            <i class="bi bi-person text-secondary"></i> <strong>USER</strong> – usuário comum (apenas consulta)
        </div>

        <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person"></i> Nome completo</label>
                <input type="text" class="form-control" th:field="*{nome}" required>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-key"></i> Senha
                    <small class="text-muted fw-normal" th:if="${usuario.id != null}">
                        (deixe em branco para manter a atual)
                    </small>
                </label>
                <input type="password" class="form-control" th:field="*{senha}"
                       th:required="${usuario.id == null}">
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-shield-lock"></i> Perfil de acesso</label>
                <select class="form-select" th:field="*{role}" required>
                    <option value="">Selecione um perfil</option>
                    <option value="ADMIN">Administrador (acesso total)</option>
                    <option value="PROFESSOR">Professor (notas e boletins)</option>
                    <option value="SECRETARIA">Secretaria (cadastros)</option>
                    <option value="USER">Usuário comum</option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Salvar
                </button>
                <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
