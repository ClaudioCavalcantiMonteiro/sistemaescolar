<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .filter-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 20px; margin-bottom: 20px;
        }
        .table-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .badge-info {
            background: #e8eef5; color: #4a6fa5;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600;
        }
        .table thead th {
            background: #f8fafc; color: #6c757d;
            font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 0.5px; font-weight: 600;
            border-bottom: 2px solid #e5e9f0;
        }
        .table tbody tr:hover { background: #f8fafc; }
        .btn-action {
            padding: 4px 10px; font-size: 0.75rem;
            border-radius: 6px; margin: 1px;
        }
        .badge-role {
            padding: 5px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase;
        }
        .role-ADMIN { background: #f8d7da; color: #842029; }
        .role-PROFESSOR { background: #d1ecf1; color: #0c5460; }
        .role-SECRETARIA { background: #fff3cd; color: #856404; }
        .role-USER { background: #e8eef5; color: #4a6fa5; }
        .empty-state {
            text-align: center; padding: 50px 20px; color: #6c757d;
        }
        .empty-state i { font-size: 3rem; color: #ced4da; margin-bottom: 12px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/series">Séries</a></li>
                <li class="nav-item"><a class="nav-link" href="/materias">Matérias</a></li>
                <li class="nav-item"><a class="nav-link" href="/turmas">Turmas</a></li>
                <li class="nav-item"><a class="nav-link" href="/alunos">Alunos</a></li>
                <li class="nav-item"><a class="nav-link active" href="/usuarios">Usuários</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 pb-5">

    <!-- ===== ALERTAS FLASH ===== -->
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <div th:text="${mensagemSucesso}"></div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <div th:text="${mensagemErro}"></div>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-people-fill text-primary"></i> Usuários do Sistema</h1>
            <span class="badge-info">
                <i class="bi bi-person-badge"></i>
                <span th:text="${totalFiltrado}"></span> de <span th:text="${totalUsuarios}"></span> usuário(s)
            </span>
        </div>
        <a href="/usuarios/novo" class="btn btn-success">
            <i class="bi bi-person-plus"></i> Novo Usuário
        </a>
    </div>

    <div class="filter-card">
        <form th:action="@{/usuarios}" method="get">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold text-muted">
                        <i class="bi bi-search"></i> Buscar por nome ou email
                    </label>
                    <input type="text" name="nome" class="form-control"
                           placeholder="Digite o nome ou email..."
                           th:value="${filtroNome}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">
                        <i class="bi bi-shield-lock"></i> Perfil
                    </label>
                    <select name="role" class="form-select">
                        <option value="">Todos os perfis</option>
                        <option value="ADMIN" th:selected="${filtroRole == 'ADMIN'}">Administrador</option>
                        <option value="PROFESSOR" th:selected="${filtroRole == 'PROFESSOR'}">Professor</option>
                        <option value="SECRETARIA" th:selected="${filtroRole == 'SECRETARIA'}">Secretaria</option>
                        <option value="USER" th:selected="${filtroRole == 'USER'}">Usuário</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a href="/usuarios" class="btn btn-outline-secondary" title="Limpar">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </div>
        </form>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td>
                            <i class="bi bi-person-circle text-primary me-1"></i>
                            <strong th:text="${usuario.nome}"></strong>
                        </td>
                        <td th:text="${usuario.email}"></td>
                        <td>
                            <span class="badge-role"
                                  th:classappend="'role-' + ${usuario.role}"
                                  th:text="${usuario.role}"></span>
                        </td>
                        <td class="text-center text-nowrap">
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                               class="btn btn-warning btn-action" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/usuarios/excluir/{id}(id=${usuario.id})}"
                               class="btn btn-danger btn-action"
                               th:data-nome="${usuario.nome}"
                               onclick="return confirm('EXCLUIR o usuário ' + this.dataset.nome + '?')"
                               title="Excluir">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-search"></i>
                            <h5>Nenhum usuário encontrado</h5>
                            <p>Ajuste os filtros ou <a href="/usuarios/novo">cadastre um novo usuário</a>.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a href="/home" class="btn btn-secondary"><i class="bi bi-house"></i> Voltar ao Início</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
