<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }

        @media (min-width: 1200px) {
            .container { max-width: 100% !important; padding-left: 24px; padding-right: 24px; }
        }

        .escola-header {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 60%, #0f172a 100%);
            border-radius: 14px; padding: 14px 22px; margin-bottom: 16px; color: white;
            box-shadow: 0 6px 20px rgba(30,64,175,0.22); position: relative; overflow: hidden;
            width: 100%; display: flex; align-items: center; gap: 20px;
        }
        .escola-header::before {
            content: '🎓'; position: absolute; right: -10px; top: -30px;
            font-size: 140px; opacity: 0.06; pointer-events: none;
        }
        .escola-header::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        .escola-marca {
            display: flex; align-items: center; gap: 14px; flex-shrink: 0;
            padding-right: 20px; border-right: 1px solid rgba(255,255,255,0.22);
        }
        .escola-header .logo-icon {
            width: 46px; height: 46px; background: rgba(255,255,255,0.15);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.35rem; border: 1px solid rgba(255,255,255,0.25); flex-shrink: 0;
        }
        .escola-header .escola-label {
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px;
            opacity: 0.75; margin-bottom: 1px;
        }
        .escola-header .escola-nome {
            font-size: 1.15rem; font-weight: 800; margin: 0; letter-spacing: -0.3px;
            line-height: 1.15; white-space: nowrap;
        }
        .escola-header .escola-info {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px;
            flex: 1; min-width: 0; font-size: 0.75rem; opacity: 0.92;
        }
        .escola-header .escola-info span {
            display: flex; align-items: center; gap: 6px; line-height: 1.25; white-space: nowrap;
        }
        .escola-header .escola-info i { color: #93c5fd; font-size: 0.8rem; flex-shrink: 0; }
        .escola-fallback {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            box-shadow: 0 6px 20px rgba(100,116,139,0.22);
        }

        .filter-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 20px; margin-bottom: 20px; width: 100%;
        }
        .table-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden; width: 100%;
        }
        .table thead th {
            background: #f8fafc; color: #6c757d;
            font-size: 0.8rem; text-transform: uppercase; font-weight: 600;
            border-bottom: 2px solid #e5e9f0;
        }
        .table tbody tr:hover { background: #f8fafc; }
        .badge-info {
            background: #e8eef5; color: #4a6fa5;
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
        }
        .empty-state { text-align: center; padding: 50px 20px; color: #6c757d; }
        .empty-state i { font-size: 3rem; color: #ced4da; margin-bottom: 12px; }

        @media (max-width: 768px) {
            .escola-header {
                flex-direction: column; align-items: flex-start;
                gap: 10px; padding: 14px 18px !important;
            }
            .escola-marca {
                padding-right: 0; border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.22);
                padding-bottom: 10px; width: 100%;
            }
            .escola-header .escola-nome { font-size: 1rem !important; white-space: normal; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">

    <!-- Cabeçalho da Escola -->
    <div class="escola-header" th:if="${escola != null}">
        <div class="escola-marca">
            <div class="logo-icon">🎓</div>
            <div>
                <div class="escola-label">Instituição de Ensino</div>
                <h1 class="escola-nome" th:text="${escola.nome}">Nome da Escola</h1>
            </div>
        </div>
        <div class="escola-info">
            <span th:if="${escola.cnpj != null and !escola.cnpj.isEmpty()}">
                <i class="bi bi-file-earmark-text-fill"></i>
                CNPJ: <strong th:text="${escola.cnpj}"></strong>
            </span>
            <span th:if="${escola.enderecoCompleto != null and !escola.enderecoCompleto.isEmpty()}">
                <i class="bi bi-geo-alt-fill"></i>
                <span th:text="${escola.enderecoCompleto}"></span>
            </span>
            <span th:if="${escola.telefone != null and !escola.telefone.isEmpty()}">
                <i class="bi bi-telephone-fill"></i>
                <span th:text="${escola.telefone}"></span>
            </span>
        </div>
    </div>

    <div class="escola-header escola-fallback" th:if="${escola == null}">
        <div class="escola-marca">
            <div class="logo-icon">🎓</div>
            <div>
                <div class="escola-label">Instituição de Ensino</div>
                <h1 class="escola-nome">SISTEMA ESCOLAR</h1>
            </div>
        </div>
    </div>

    <!-- Título -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-1">
                <i class="bi bi-file-earmark-text-fill text-primary"></i>
                Histórico Escolar
            </h1>
            <span class="badge-info">
                <i class="bi bi-people-fill"></i>
                <span th:text="${#lists.size(alunos)}"></span> aluno(s)
            </span>
        </div>
    </div>

    <!-- Filtros -->
    <div class="filter-card">
        <form th:action="@{/historico}" method="get">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">
                        <i class="bi bi-people"></i> Turma
                    </label>
                    <select name="turmaId" class="form-select">
                        <option value="">Todas as turmas</option>
                        <option th:each="t : ${turmas}"
                                th:value="${t.id}"
                                th:text="${t.nome}"
                                th:selected="${turmaId != null and turmaId == t.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label small fw-semibold text-muted">
                        <i class="bi bi-search"></i> Nome do aluno
                    </label>
                    <input type="text" name="nome" class="form-control"
                           placeholder="Digite parte do nome..."
                           th:value="${nome}">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a href="/historico" class="btn btn-outline-secondary" title="Limpar">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </div>
        </form>
    </div>

    <!-- Tabela de alunos -->
    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>Aluno</th>
                        <th>Matrícula</th>
                        <th>Turma</th>
                        <th>Série</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno, iter : ${alunos}">
                        <td th:text="${iter.count}" class="text-muted"></td>
                        <td>
                            <i class="bi bi-person-circle text-primary me-1"></i>
                            <strong th:text="${aluno.nome}"></strong>
                        </td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${aluno.matricula != null ? aluno.matricula : '-'}"></span>
                        </td>
                        <td th:text="${aluno.turma != null ? aluno.turma.nome : '-'}"></td>
                        <td th:text="${aluno.serie != null ? aluno.serie.nome : '-'}"></td>
                        <td class="text-center text-nowrap">
                            <a th:href="@{/historico/aluno/{id}(id=${aluno.id})}"
                               class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i> Ver Históricos
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(alunos)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <h5>Nenhum aluno encontrado</h5>
                            <p>Ajuste os filtros ou cadastre um aluno.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <div th:replace="~{fragments/navbar :: botaoInicio}"></div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
