<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Histórico Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .form-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 32px; max-width: 700px;
            width: 100%; margin: 0 auto;
        }
        .form-card h1 { font-size: 1.4rem; font-weight: 700; color: #1e40af; margin-bottom: 8px; }
        .form-card .sub { color: #6c757d; margin-bottom: 24px; font-size: 0.9rem; }
        .form-label { font-weight: 600; color: #495057; font-size: 0.9rem; }
        .aluno-box {
            background: #e8eef5; border-left: 4px solid #1e40af;
            padding: 16px 20px; border-radius: 8px;
            margin-bottom: 24px;
        }
        .info-box {
            background: #fff3cd; border-left: 4px solid #ffc107;
            padding: 12px 16px; border-radius: 8px;
            font-size: 0.88rem; color: #856404; margin-bottom: 24px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">
    <div class="form-card">

        <h1><i class="bi bi-file-earmark-plus-fill text-success"></i> Gerar Histórico Escolar</h1>
        <p class="sub">O sistema vai consolidar automaticamente as notas e frequências do aluno para o ano escolhido.</p>

        <div class="aluno-box">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-4 text-primary"></i>
                <div>
                    <strong th:text="${aluno.nome}"></strong>
                    <div class="text-muted small">
                        Matrícula: <span th:text="${aluno.matricula != null ? aluno.matricula : '-'}"></span>
                        • Série: <span th:text="${aluno.serie != null ? aluno.serie.nome : '-'}"></span>
                        • Turma: <span th:text="${aluno.turma != null ? aluno.turma.nome : '-'}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="info-box">
            <i class="bi bi-info-circle-fill"></i>
            O sistema irá buscar apenas as notas lançadas no ano letivo selecionado. Você poderá editar tudo depois.
        </div>

        <form th:action="@{/historico/gerar}" method="post">
            <input type="hidden" name="alunoId" th:value="${aluno.id}">

            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-calendar"></i> Ano Letivo
                </label>
                <input type="number" name="anoLetivo" class="form-control"
                       th:value="${anoAtual}" min="2000" max="2100" required>
                <small class="text-muted">Ano em que as notas foram lançadas.</small>
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-magic"></i> Gerar Histórico
                </button>
                <a th:href="@{/historico/aluno/{id}(id=${aluno.id})}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
