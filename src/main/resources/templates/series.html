<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<!-- Bootstrap primeiro -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Depois seu CSS personalizado -->
	<link rel="stylesheet" th:href="@{/style.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Séries</title>
    <!-- Carregando Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">Lista de Séries</h1>
            <a th:href="@{/series/0}" class="btn btn-success">+ Cadastrar Nova Série</a>
        </div>

        <div class="card shadow-sm">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="serie : ${series}">
                        <td th:text="${serie.id}"></td>
                        <td th:text="${serie.nome}"></td>
                        <td th:text="${serie.descricao}"></td>
                        <td class="text-end">
                            <a th:href="@{/series/{id}(id=${serie.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <a th:href="@{/series/excluir/{id}(id=${serie.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(series)}">
                        <td colspan="4" class="text-center text-muted">Nenhuma série cadastrada.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
