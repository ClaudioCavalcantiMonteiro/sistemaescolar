<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/series">Séries</a></li>
                <li class="nav-item"><a class="nav-link" href="/materias">Matérias</a></li>
                <li class="nav-item"><a class="nav-link" href="/turmas">Turmas</a></li>
                <li class="nav-item"><a class="nav-link active" href="/alunos">Alunos</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Alunos</h1>
        <a href="/alunos/novo" class="btn btn-success"><i class="bi bi-plus-circle"></i> Novo Aluno</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Matrícula</th>
                    <th>Série</th>
                    <th>Turma</th>
                    <th>Responsável</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aluno : ${alunos}">
                    <td th:text="${aluno.id}"></td>
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.matricula}"></td>
                    <td th:text="${aluno.serie != null ? aluno.serie.nome : 'N/A'}"></td>
                    <td th:text="${aluno.turma != null ? aluno.turma.nome : 'N/A'}"></td>
                    <td th:text="${aluno.responsavelFinanceiro != null ? aluno.responsavelFinanceiro.nome : 'N/A'}"></td>
                    <td>
                        <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i> Editar</a>
                        <a th:href="@{/alunos/excluir/{id}(id=${aluno.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirma exclusão?')"><i class="bi bi-trash"></i> Excluir</a>
                        <a th:href="@{/notas/boletim/{id}(id=${aluno.id})}" class="btn btn-sm btn-info"><i class="bi bi-file-text"></i> Boletim</a>
                        <a th:href="@{/notas/editar/{id}(id=${aluno.id})}" class="btn btn-sm btn-secondary"><i class="bi bi-pencil-square"></i> Editar Notas</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(alunos)}">
                    <td colspan="7" class="text-center text-muted">Nenhum aluno cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a href="/home" class="btn btn-secondary"><i class="bi bi-house"></i> Voltar</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
