<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .compact-form .row { margin-bottom: 8px; }
        .compact-form .form-label { font-size: 0.85rem; margin-bottom: 2px; }
        .compact-form .form-control, .compact-form .form-select { font-size: 0.9rem; padding: 4px 8px; }
        .section-title { font-size: 1.1rem; font-weight: 600; margin: 12px 0 8px 0; border-bottom: 1px solid #dee2e6; padding-bottom: 4px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/alunos"><i class="bi bi-arrow-left"></i> Voltar</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <h1 class="h4">Cadastrar/Editar Aluno</h1>
    <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post" class="compact-form">
        <input type="hidden" th:field="*{id}" />

        <div class="section-title">Dados do Aluno</div>
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" th:field="*{nome}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Data Nasc.</label>
                <input type="date" class="form-control" th:field="*{dataNascimento}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Matrícula</label>
                <input type="text" class="form-control" th:field="*{matricula}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Série</label>
                <select class="form-select" th:field="*{serie.id}">
                    <option value="">Selecione</option>
                    <option th:each="serie : ${series}" th:value="${serie.id}" th:text="${serie.nome}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Turma</label>
                <select class="form-select" th:field="*{turma.id}">
                    <option value="">Selecione</option>
                    <option th:each="turma : ${turmas}" th:value="${turma.id}" th:text="${turma.nome}"></option>
                </select>
            </div>
        </div>

        <!-- Responsável Financeiro -->
        <div class="section-title">Responsável Financeiro</div>
        <input type="hidden" th:field="*{responsavelFinanceiro.id}" />

        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Nome do Responsável</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.nome}" placeholder="Digite o nome do responsável" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Grau Parentesco</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.grauParentesco}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.cpf}" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-3">
                <label class="form-label">RG</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.rg}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.telefone}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Celular</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.celular}" />
            </div>
            <div class="col-md-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{responsavelFinanceiro.email}" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.cep}" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Endereço</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.endereco}" />
            </div>
            <div class="col-md-2">
                <label class="form-label">Número</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.numero}" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.bairro}" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" th:field="*{responsavelFinanceiro.cidade}" />
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar</button>
            <a href="/alunos" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
