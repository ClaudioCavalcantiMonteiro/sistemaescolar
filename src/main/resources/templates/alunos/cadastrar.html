<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 32px;
            max-width: 900px;
            margin: 0 auto;
        }
        .form-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .form-card .subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #4a6fa5;
            border-bottom: 2px solid #e5e9f0;
            padding-bottom: 8px;
            margin: 24px 0 16px 0;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e0e7ef;
            padding: 10px 14px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #4a6fa5;
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">
    <div class="form-card">
        <h1>
            <i class="bi bi-person-plus-fill text-primary"></i>
            <span th:if="${aluno.id == null}">Nova Matrícula</span>
            <span th:if="${aluno.id != null}">Editar Matrícula</span>
        </h1>
        <p class="subtitle">Preencha os dados do aluno e do responsável financeiro.</p>

        <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post">

            <!-- ===== MENSAGENS DE ERRO ===== -->
            <div th:if="${param.cpfInvalido}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <strong>CPF inválido!</strong> Digite um CPF válido (11 dígitos).
            </div>
            <div th:if="${param.cpfDuplicado}" class="alert alert-warning">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <strong>CPF já cadastrado!</strong> Este CPF pertence a outro responsável.
            </div>

            <input type="hidden" th:field="*{id}">

            <!-- ===== DADOS DO ALUNO ===== -->
            <div class="section-title">
                <i class="bi bi-person"></i> Dados do Aluno
            </div>

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Nome do Aluno *</label>
                    <input type="text" class="form-control" th:field="*{nome}" required
                           placeholder="Nome completo">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Matrícula</label>
                    <input type="text" class="form-control" th:field="*{matricula}"
                           placeholder="Ex: 001">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-control" th:field="*{dataNascimento}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Série</label>
                    <select class="form-select" th:field="*{serie.id}">
                        <option value="">Selecione</option>
                        <option th:each="serie : ${series}"
                                th:value="${serie.id}"
                                th:text="${serie.nome}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Turma</label>
                    <select class="form-select" th:field="*{turma.id}">
                        <option value="">Selecione</option>
                        <option th:each="turma : ${turmas}"
                                th:value="${turma.id}"
                                th:text="${turma.nome}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Ano Letivo</label>
                    <input type="number" class="form-control" th:field="*{anoLetivo}"
                           min="2020" max="2100" placeholder="Ex: 2026">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data da Matrícula</label>
                    <input type="date" class="form-control" th:field="*{dataMatricula}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status da Matrícula</label>
                    <select class="form-select" th:field="*{matriculaAtiva}">
                        <option th:value="true">Ativa</option>
                        <option th:value="false">Inativa</option>
                    </select>
                </div>
            </div>

            <!-- ===== RESPONSÁVEL FINANCEIRO ===== -->
            <div class="section-title">
                <i class="bi bi-person-badge"></i> Responsável Financeiro
            </div>

            <input type="hidden" th:field="*{responsavelFinanceiro.id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome do Responsável</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.nome}"
                           placeholder="Nome completo">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Grau de Parentesco</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.grauParentesco}"
                           placeholder="Ex: Pai, Mãe">
                </div>
                <div class="col-md-3">
                    <label class="form-label">CPF</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.cpf}"
                           id="cpfInput" maxlength="14" placeholder="000.000.000-00">
                </div>
                <div class="col-md-3">
                    <label class="form-label">RG</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.rg}"
                           placeholder="RG">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.telefone}"
                           placeholder="(00) 0000-0000">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Celular</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.celular}"
                           placeholder="(00) 00000-0000">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{responsavelFinanceiro.email}"
                           placeholder="email@exemplo.com">
                </div>
            </div>

            <!-- ===== ENDEREÇO ===== -->
            <div class="section-title">
                <i class="bi bi-geo-alt"></i> Endereço
            </div>

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Endereço</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.endereco}"
                           placeholder="Rua, Avenida...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Número</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.numero}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Bairro</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.bairro}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cidade</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.cidade}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">CEP</label>
                    <input type="text" class="form-control" th:field="*{responsavelFinanceiro.cep}"
                           placeholder="00000-000">
                </div>
            </div>

            <!-- ===== BOTÕES ===== -->
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Salvar
                </button>
                <a href="/home" class="btn btn-primary">
                    <i class="bi bi-house-door"></i> Início
                </a>
                <a href="/alunos" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>

<script>
    // Máscara de CPF
    document.addEventListener('DOMContentLoaded', function() {
        const cpfInput = document.getElementById('cpfInput');
        if (cpfInput) {
            cpfInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.substring(0, 11);

                if (value.length > 9) {
                    value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                } else if (value.length > 6) {
                    value = value.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
                } else if (value.length > 3) {
                    value = value.replace(/(\d{3})(\d{0,3})/, '$1.$2');
                }
                e.target.value = value;
            });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
