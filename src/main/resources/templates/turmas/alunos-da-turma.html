<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos da Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }
        .header-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 24px; margin-bottom: 20px;
        }
        .table-card {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }
        .badge-info {
            background: #e8eef5; color: #4a6fa5;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600;
        }
        .table thead th {
            background: #f8fafc; color: #6c757d;
            font-size: 0.8rem; text-transform: uppercase;
            letter-spacing: 0.5px; font-weight: 600;
            border-bottom: 2px solid #e5e9f0;
        }
        .table tbody tr:hover { background: #f8fafc; }
        .btn-action {
            padding: 4px 10px; font-size: 0.75rem;
            border-radius: 6px; margin: 1px;
        }
        .badge-ativa { background: #d1e7dd; color: #0f5132; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-inativa { background: #f8d7da; color: #842029; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .empty-state { text-align: center; padding: 50px 20px; color: #6c757d; }
        .empty-state i { font-size: 3rem; color: #ced4da; margin-bottom: 12px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">

    <!-- ===== CABEÇALHO ===== -->
    <div class="header-card">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="h3 mb-2">
                    <i class="bi bi-people-fill text-primary"></i>
                    Alunos da Turma
                </h1>
                <span class="badge-info">
                    <i class="bi bi-bookmark"></i>
                    <strong th:text="${turma.nome}">Turma</strong>
                    &nbsp;·&nbsp;
                    <span th:text="${turma.serie != null ? turma.serie.nome : 'N/A'}">Série</span>
                    <span th:if="${turma.ano != null}">
                        &nbsp;·&nbsp; Ano <span th:text="${turma.ano}"></span>
                    </span>
                    <span th:if="${turma.turno != null and !turma.turno.isEmpty()}">
                        &nbsp;·&nbsp; <span th:text="${turma.turno}"></span>
                    </span>
                </span>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/turmas/{id}/alunos/pdf(id=${turma.id})}"
                   target="_blank"
                   class="btn btn-danger">
                    <i class="bi bi-file-earmark-pdf"></i> Gerar PDF
                </a>
                <a href="/turmas/alunos" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>
        </div>
    </div>

    <!-- ===== TABELA DE ALUNOS ===== -->
    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width: 60px;">Nº</th>
                        <th>Nome do Aluno</th>
                        <th>Matrícula</th>
                        <th>Data Nascimento</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno, iter : ${alunos}">
                        <td th:text="${iter.count}" class="text-muted"></td>
                        <td>
                            <i class="bi bi-person-circle text-primary me-1"></i>
                            <strong th:text="${aluno.nome}"></strong>
                        </td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${aluno.matricula != null ? aluno.matricula : '-'}"></span>
                        </td>
                        <td th:text="${aluno.dataNascimento != null ? #temporals.format(aluno.dataNascimento, 'dd/MM/yyyy') : '-'}"></td>
                        <td>
                            <span th:if="${aluno.matriculaAtiva == null or !aluno.matriculaAtiva}"
                                  class="badge-inativa">
                                <i class="bi bi-x-circle"></i> Inativa
                            </span>
                            <span th:if="${aluno.matriculaAtiva != null and aluno.matriculaAtiva}"
                                  class="badge-ativa">
                                <i class="bi bi-check-circle"></i> Ativa
                            </span>
                        </td>
                        <td class="text-center text-nowrap">
                            <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}"
                               class="btn btn-warning btn-action" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/notas/boletim/{id}(id=${aluno.id})}"
                               class="btn btn-info btn-action" title="Boletim">
                                <i class="bi bi-file-text"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(alunos)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-people"></i>
                            <h5>Nenhum aluno nesta turma</h5>
                            <p>Cadastre alunos e vincule-os a esta turma para vê-los aqui.</p>
                            <a href="/alunos/novo" class="btn btn-success mt-2">
                                <i class="bi bi-plus-circle"></i> Cadastrar Aluno
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== RODAPÉ COM TOTAL ===== -->
    <div class="mt-3 d-flex justify-content-between align-items-center">
        <div class="text-muted small">
            <i class="bi bi-info-circle"></i>
            Total: <strong th:text="${#lists.size(alunos)}"></strong> aluno(s)
        </div>
        <div th:replace="~{fragments/navbar :: botaoInicio}"></div>
    </div>

</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
