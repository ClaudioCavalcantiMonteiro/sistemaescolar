<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #e6f0fa 0%, #d4e2f2 100%);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255,255,255,0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(58,86,130,0.12);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2a3a;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: #4a6fa5; color: white; box-shadow: 0 4px 12px rgba(74,111,165,0.2); }
        .btn-primary:hover { background: #3a5a8a; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,111,165,0.3); }
        .btn-warning { background: #f5b342; color: #1a2a3a; }
        .btn-warning:hover { background: #e6a030; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }
        .btn-secondary { background: #e0e7ef; color: #1a2a3a; }
        .btn-secondary:hover { background: #ccd5e0; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th {
            text-align: left;
            padding: 12px 8px 8px 0;
            font-size: 13px;
            font-weight: 600;
            color: #5a6a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #dce5ef;
        }
        td {
            padding: 12px 8px 12px 0;
            border-bottom: 1px solid #f0f4fa;
            color: #1a2a3a;
        }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .actions .btn { padding: 6px 12px; font-size: 12px; border-radius: 10px; }
        .empty { text-align: center; color: #8a9aae; padding: 30px 0; }
        .back-link { margin-top: 20px; display: inline-block; }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 14px;
        }
        .alert-success { background: #d1e7dd; color: #0f5132; border-left: 4px solid #10b981; }
        .alert-danger { background: #f8d7da; color: #842029; border-left: 4px solid #dc3545; }
        .alert i { font-size: 1.2rem; }

        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== ALERTAS FLASH ===== -->
        <div th:if="${mensagemSucesso}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${mensagemSucesso}"></span>
        </div>

        <div th:if="${mensagemErro}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${mensagemErro}"></span>
        </div>

        <div class="header">
            <h1>Turmas</h1>
            <a href="/turmas/novo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova Turma</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Série</th>
                    <th>Ano</th>
                    <th>Turno</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="turma : ${turmas}">
                    <td th:text="${turma.id}"></td>
                    <td th:text="${turma.nome}"></td>
                    <td th:text="${turma.serie != null ? turma.serie.nome : 'N/A'}"></td>
                    <td th:text="${turma.ano}"></td>
                    <td th:text="${turma.turno}"></td>
                    <td>
                        <div class="actions">
                            <!-- NOVO: Ver alunos da turma + gerar PDF -->
                            <a th:href="@{/turmas/{id}/alunos(id=${turma.id})}"
                               class="btn btn-info"
                               title="Ver Alunos / Gerar PDF">
                                <i class="bi bi-people-fill"></i> Alunos
                            </a>
                            <a th:href="@{/turmas/editar/{id}(id=${turma.id})}" class="btn btn-warning" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/turmas/excluir/{id}(id=${turma.id})}" class="btn btn-danger"
                               th:data-nome="${turma.nome}"
                               onclick="return confirm('EXCLUIR a turma ' + this.dataset.nome + '?')"
                               title="Excluir">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(turmas)}">
                    <td colspan="6" class="empty">Nenhuma turma cadastrada.</td>
                </tr>
            </tbody>
        </table>

        <div class="back-link">
            <a href="/home" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
        </div>
    </div>
</body>
</html>
