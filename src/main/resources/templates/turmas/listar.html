<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista de Turmas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Turmas</h1>
    <a href="/turmas/novo" class="btn btn-primary mb-3">Nova Turma</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Série</th>
                <th>Ano</th>
                <th>Turno</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="turma : ${turmas}">
                <td th:text="${turma.id}"></td>
                <td th:text="${turma.nome}"></td>
                <td th:text="${turma.serie != null ? turma.serie.nome : 'N/A'}"></td>
                <td th:text="${turma.ano}"></td>
                <td th:text="${turma.turno}"></td>
                <td>
                    <a th:href="@{/turmas/editar/{id}(id=${turma.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/turmas/excluir/{id}(id=${turma.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirma exclusão?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/home" class="btn btn-secondary">Voltar</a>
</body>
</html>
