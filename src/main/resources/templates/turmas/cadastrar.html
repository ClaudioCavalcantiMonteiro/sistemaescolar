<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <h1>Cadastrar/Editar Turma</h1>
    <form th:action="@{/turmas/salvar}" th:object="${turma}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Nome da Turma (ex: A, B)</label>
            <input type="text" class="form-control" th:field="*{nome}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Ano</label>
            <input type="text" class="form-control" th:field="*{ano}" placeholder="ex: 2025">
        </div>
        <div class="mb-3">
            <label class="form-label">Turno</label>
            <select class="form-control" th:field="*{turno}">
                <option value="">Selecione</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Série</label>
            <select class="form-control" th:field="*{serie.id}">
                <option value="">Selecione</option>
                <option th:each="serie : ${series}" th:value="${serie.id}" th:text="${serie.nome}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/turmas" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
