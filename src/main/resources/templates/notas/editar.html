<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Editar Notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/notas/lancar"><i class="bi bi-arrow-left"></i> Voltar</a></li>
                <li class="nav-item"><a class="nav-link" href="/home"><i class="bi bi-house"></i> Início</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Editar Notas de <span th:text="${aluno.nome}"></span></h1>
    <div th:if="${param.sucesso}" class="alert alert-success">Notas salvas com sucesso!</div>

    <form th:action="@{/notas/salvar-todas}" method="post">
        <input type="hidden" name="alunoId" th:value="${aluno.id}" />

        <div th:each="materia : ${materias}" class="card mb-3">
            <div class="card-header bg-primary text-white">
                <strong th:text="${materia.nome}"></strong>
            </div>
            <div class="card-body">
                <div class="row">
                    <div th:each="unidade : ${#numbers.sequence(1, 4)}" class="col-md-3 mb-3">
                        <h6 class="text-primary" th:text="${unidade} + 'ª Unidade'"></h6>
                        <span th:with="nota=${notasMap.get(materia.id) != null ? notasMap.get(materia.id).get(unidade) : null}">
                            <!-- ID oculto da nota -->
                            <input type="hidden"
                                   th:name="'notas[' + ${materia.id} + '][' + ${unidade} + '].id'"
                                   th:value="${nota != null ? nota.id : ''}" />

                            <div class="mb-2">
                                <label class="form-label small">Nota 1</label>
                                <input type="number" class="form-control form-control-sm" step="0.1" min="0" max="10"
                                       th:name="'notas[' + ${materia.id} + '][' + ${unidade} + '].nota1'"
                                       th:value="${nota != null ? nota.nota1 : ''}" />
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Nota 2</label>
                                <input type="number" class="form-control form-control-sm" step="0.1" min="0" max="10"
                                       th:name="'notas[' + ${materia.id} + '][' + ${unidade} + '].nota2'"
                                       th:value="${nota != null ? nota.nota2 : ''}" />
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Nota 3</label>
                                <input type="number" class="form-control form-control-sm" step="0.1" min="0" max="10"
                                       th:name="'notas[' + ${materia.id} + '][' + ${unidade} + '].nota3'"
                                       th:value="${nota != null ? nota.nota3 : ''}" />
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">Nota 4</label>
                                <input type="number" class="form-control form-control-sm" step="0.1" min="0" max="10"
                                       th:name="'notas[' + ${materia.id} + '][' + ${unidade} + '].nota4'"
                                       th:value="${nota != null ? nota.nota4 : ''}" />
                            </div>
                            <div>
                                <label class="form-label small">Recuperação</label>
                                <input type="number" class="form-control form-control-sm" step="0.1" min="0" max="10"
                                       th:name="'notas[' + ${materia.id} + '][' + ${unidade} + '].recuperacao'"
                                       th:value="${nota != null ? nota.recuperacao : ''}" />
                            </div>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar Todas as Notas</button>
            <a href="/notas/lancar" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
