<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Boletins - Selecionar Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }

        .page-header {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%);
            color: white;
            padding: 32px;
            border-radius: 16px;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px rgba(44, 62, 80, 0.15);
        }
        .page-header h1 { font-weight: 700; margin-bottom: 4px; }
        .page-header p { opacity: 0.85; margin: 0; }

        .turma-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            height: 100%;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .turma-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
            color: inherit;
        }
        .turma-card-header {
            background: linear-gradient(135deg, #4a6fa5 0%, #5b82b8 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .turma-card-header h5 {
            margin: 0;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .turma-card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .turma-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #495057;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .turma-info i { color: #4a6fa5; width: 18px; }
        .badge-alunos {
            background: #e8eef5;
            color: #4a6fa5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .btn-ver {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            width: 100%;
            margin-top: 16px;
            transition: all 0.2s;
        }
        .btn-ver:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(39, 174, 96, 0.3);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            color: #6c757d;
        }
        .empty-state i { font-size: 4rem; color: #ced4da; margin-bottom: 16px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container mt-4 pb-5">

    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1><i class="bi bi-file-earmark-text-fill"></i> Ver Boletins</h1>
                <p>Escolha uma turma para visualizar as notas de todos os alunos.</p>
            </div>
            <a href="/notas/lancar" class="btn btn-light">
                <i class="bi bi-pencil-square"></i> Lançar Notas
            </a>
        </div>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(turmas)}">
        <div th:each="turma : ${turmas}" class="col-md-6 col-lg-4">
            <a th:href="@{/notas/turma/{id}(id=${turma.id})}" class="turma-card">
                <div class="turma-card-header">
                    <h5><i class="bi bi-people-fill me-2"></i><span th:text="${turma.nome}"></span></h5>
                </div>
                <div class="turma-card-body">
                    <div>
                        <div class="turma-info">
                            <i class="bi bi-book-fill"></i>
                            <span><strong>Série:</strong> <span th:text="${turma.serie != null ? turma.serie.nome : 'N/A'}"></span></span>
                        </div>
                        <div class="turma-info" th:if="${turma.ano != null and !turma.ano.isEmpty()}">
                            <i class="bi bi-calendar-fill"></i>
                            <span><strong>Ano:</strong> <span th:text="${turma.ano}"></span></span>
                        </div>
                        <div class="turma-info" th:if="${turma.turno != null and !turma.turno.isEmpty()}">
                            <i class="bi bi-clock-fill"></i>
                            <span><strong>Turno:</strong> <span th:text="${turma.turno}"></span></span>
                        </div>
                        <div class="turma-info">
                            <i class="bi bi-person-fill"></i>
                            <span class="badge-alunos">
                                <span th:text="${#lists.size(turma.alunos)}"></span> aluno(s)
                            </span>
                        </div>
                    </div>
                    <button class="btn-ver">
                        <i class="bi bi-eye-fill"></i> Ver Boletins
                    </button>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(turmas)}" class="empty-state">
        <i class="bi bi-inbox"></i>
        <h4>Nenhuma turma cadastrada</h4>
        <p>Cadastre uma turma para começar.</p>
        <a href="/turmas/novo" class="btn btn-primary mt-2">
            <i class="bi bi-plus-circle"></i> Cadastrar Turma
        </a>
    </div>

    <div class="mt-4 d-flex gap-3">
        <a href="/notas/lancar" class="btn btn-primary">
            <i class="bi bi-pencil-square"></i> Lançar Notas
        </a>
        <a href="/home" class="btn btn-secondary">
            <i class="bi bi-house-door"></i> Início
        </a>
    </div>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
