<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Boletim do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; padding: 0; }
            .container { max-width: 100%; }
            .grafico-container { page-break-inside: avoid; }
        }
        .table-bordered th, .table-bordered td { border: 1px solid #dee2e6; }
        .grafico-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="window.print()">
                        <i class="bi bi-printer"></i> Imprimir
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notas/boletim/{id}/pdf(id=${aluno.id})}" target="_blank">
                        <i class="bi bi-file-earmark-pdf"></i> PDF
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/home"><i class="bi bi-house"></i> Início</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="text-center mb-4">
        <h1>Boletim Escolar</h1>
        <h2 th:text="${aluno.nome}"></h2>
        <p>
            <strong>Série:</strong> <span th:text="${aluno.serie != null ? aluno.serie.nome : 'N/A'}"></span> |
            <strong>Turma:</strong> <span th:text="${aluno.turma != null ? aluno.turma.nome : 'N/A'}"></span> |
            <strong>Matrícula:</strong> <span th:text="${aluno.matricula}"></span>
        </p>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-primary">
            <tr>
                <th>Matéria</th>
                <th>1ª Unidade</th>
                <th>2ª Unidade</th>
                <th>3ª Unidade</th>
                <th>4ª Unidade</th>
                <th>Média Final</th>
                <th>Resultado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="materia : ${materias}">
                <td th:text="${materia.nome}"></td>
                <td th:each="unidade : ${#numbers.sequence(1, 4)}">
                    <span th:with="notaMap=${notasPorMateria.get(materia.id)}">
                        <span th:with="nota=${notaMap != null ? notaMap.get(unidade) : null}">
                            <span th:if="${nota != null and nota.mediaFinal != null}" th:text="${#numbers.formatDecimal(nota.mediaFinal, 1, 1)}"></span>
                            <span th:if="${nota == null or nota.mediaFinal == null}">-</span>
                        </span>
                    </span>
                </td>
                <td>
                    <span th:with="medias=${notasPorMateria.get(materia.id) != null ? notasPorMateria.get(materia.id).values().![mediaFinal].?[#this != null] : null}">
                        <span th:if="${medias != null and !medias.isEmpty()}" th:text="${#numbers.formatDecimal(#aggregates.avg(medias), 1, 1)}"></span>
                        <span th:if="${medias == null or medias.isEmpty()}">-</span>
                    </span>
                </td>
                <td>
                    <span th:with="medias=${notasPorMateria.get(materia.id) != null ? notasPorMateria.get(materia.id).values().![mediaFinal].?[#this != null] : null}">
                        <span th:if="${medias != null and !medias.isEmpty() and #aggregates.avg(medias) >= 6}" style="color: green; font-weight: bold;">Aprovado</span>
                        <span th:if="${medias != null and !medias.isEmpty() and #aggregates.avg(medias) < 6}" style="color: red; font-weight: bold;">Reprovado</span>
                        <span th:if="${medias == null or medias.isEmpty()}">-</span>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- GRÁFICO -->
    <div class="card mt-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-graph-up-arrow"></i> Evolução do Aluno por Unidade</h5>
        </div>
        <div class="card-body">
            <div class="grafico-container">
                <canvas id="graficoEvolucao"></canvas>
            </div>
        </div>
    </div>

    <!-- Botões -->
    <div class="no-print text-center mt-4">
        <button class="btn btn-primary" onclick="window.print()">
            <i class="bi bi-printer"></i> Imprimir
        </button>
        <a th:href="@{/notas/boletim/{id}/pdf(id=${aluno.id})}"
           class="btn btn-danger" target="_blank">
            <i class="bi bi-file-earmark-pdf"></i> Baixar PDF
        </a>
        <a href="/home" class="btn btn-secondary">
            <i class="bi bi-house"></i> Voltar
        </a>
    </div>
</div>

<script th:inline="javascript">
    const labels = JSON.parse(/*[[${graficoLabels}]]*/ '[]');
    const datasets = JSON.parse(/*[[${graficoDatasets}]]*/ '[]');

    window.addEventListener('load', function() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 500 },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 10,
                        ticks: { stepSize: 2 },
                        title: { display: true, text: 'Média' }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: { boxWidth: 20, padding: 10, font: { size: 11 } }
                    },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => ctx.dataset.label + ': ' + (ctx.raw !== null ? ctx.raw.toFixed(1) : '-')
                        }
                    }
                }
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
