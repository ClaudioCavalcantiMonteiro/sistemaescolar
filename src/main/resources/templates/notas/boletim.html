<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Boletim do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @media print { .no-print { display: none; } }
        .table-bordered th, .table-bordered td { border: 1px solid #dee2e6; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</a></li>
                <li class="nav-item"><a class="nav-link" href="/home"><i class="bi bi-house"></i> Início</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="text-center mb-4">
        <h1>Boletim Escolar</h1>
        <h2 th:text="${aluno.nome}"></h2>
        <p>
            <strong>Série:</strong> <span th:text="${aluno.serie != null ? aluno.serie.nome : 'N/A'}"></span> |
            <strong>Turma:</strong> <span th:text="${aluno.turma != null ? aluno.turma.nome : 'N/A'}"></span> |
            <strong>Matrícula:</strong> <span th:text="${aluno.matricula}"></span>
        </p>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-primary">
            <tr>
                <th>Matéria</th>
                <th>1ª Unidade</th>
                <th>2ª Unidade</th>
                <th>3ª Unidade</th>
                <th>4ª Unidade</th>
                <th>Média Final</th>
                <th>Resultado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="materia : ${materias}">
                <td th:text="${materia.nome}"></td>
                <!-- Para cada unidade, pega a nota do mapa -->
                <td th:each="unidade : ${#numbers.sequence(1, 4)}">
                    <span th:with="nota=${notasPorMateria.get(materia.id) != null ? notasPorMateria.get(materia.id).get(unidade) : null}">
                        <span th:if="${nota != null}" th:text="${nota.mediaFinal != null ? #numbers.formatDecimal(nota.mediaFinal, 1, 1) : '-'}"></span>
                        <span th:if="${nota == null}">-</span>
                    </span>
                </td>
                <!-- Média final -->
                <td>
                    <span th:with="medias=${notasPorMateria.get(materia.id) != null ? notasPorMateria.get(materia.id).values().![mediaFinal].?[#this != null] : null}">
                        <span th:if="${medias != null and !medias.isEmpty()}" th:text="${#numbers.formatDecimal(#aggregates.avg(medias), 1, 1)}"></span>
                        <span th:if="${medias == null or medias.isEmpty()}">-</span>
                    </span>
                </td>
                <!-- Resultado -->
                <td>
                    <span th:with="medias=${notasPorMateria.get(materia.id) != null ? notasPorMateria.get(materia.id).values().![mediaFinal].?[#this != null] : null}">
                        <span th:if="${medias != null and !medias.isEmpty() and #aggregates.avg(medias) >= 6}" style="color: green;">Aprovado</span>
                        <span th:if="${medias != null and !medias.isEmpty() and #aggregates.avg(medias) < 6}" style="color: red;">Reprovado</span>
                        <span th:if="${medias == null or medias.isEmpty()}">-</span>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="no-print text-center mt-3">
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir Boletim</button>
        <a href="/home" class="btn btn-secondary">Voltar</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
