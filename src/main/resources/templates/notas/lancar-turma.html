<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançar Notas - Turma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%); min-height: 100vh; }

        .info-bar {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%);
            color: white;
            padding: 20px 28px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.15);
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .info-item i { font-size: 1.2rem; opacity: 0.85; }
        .info-item strong { font-weight: 700; }
        .info-item .badge-info {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .progress-bar-container {
            background: white;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #495057;
        }
        .progress {
            height: 12px;
            border-radius: 6px;
            background: #e9ecef;
        }
        .progress-bar {
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .alunos-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .aluno-row {
            display: grid;
            grid-template-columns: 40px 1fr 90px 90px 90px 90px 110px 80px;
            gap: 8px;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f4fa;
            transition: background 0.2s;
        }
        .aluno-row:hover { background: #f8fafc; }
        .aluno-row.header {
            background: #f8fafc;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c757d;
            font-weight: 700;
            border-bottom: 2px solid #e5e9f0;
        }
        .aluno-nome {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95rem;
        }
        .aluno-numero {
            font-weight: 700;
            color: #adb5bd;
            font-size: 0.9rem;
        }

        .nota-input {
            width: 100%;
            padding: 10px 8px;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            border: 2px solid #e0e7ef;
            border-radius: 10px;
            background: #f8fafc;
            transition: all 0.2s;
            color: #2c3e50;
        }
        .nota-input:focus {
            outline: none;
            border-color: #4a6fa5;
            background: white;
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.15);
        }
        .nota-input.preenchida {
            background: #e8f5e9;
            border-color: #a5d6a7;
            color: #2e7d32;
        }
        .nota-input.recuperacao {
            background: #fff8e1;
            border-color: #ffe082;
        }

        .media-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            background: #f0f4fa;
            color: #adb5bd;
            min-width: 60px;
        }
        .media-badge.aprovado { background: #d1e7dd; color: #0f5132; }
        .media-badge.reprovado { background: #f8d7da; color: #842029; }

        .btn-floating {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 700;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            box-shadow: 0 8px 24px rgba(39, 174, 96, 0.4);
            transition: all 0.2s;
        }
        .btn-floating:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(39, 174, 96, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty-state i { font-size: 4rem; color: #ced4da; margin-bottom: 16px; }

        @media (max-width: 900px) {
            .aluno-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 16px;
                border: 1px solid #e5e9f0;
                border-radius: 10px;
                margin: 8px;
            }
            .aluno-row.header { display: none; }
            .aluno-row > div:before {
                content: attr(data-label);
                display: block;
                font-size: 0.75rem;
                color: #6c757d;
                font-weight: 600;
                margin-bottom: 2px;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<th:block th:replace="~{fragments/navbar :: estiloNavbar}"></th:block>

<div class="container-fluid mt-4 pb-5" style="padding-left: 32px; padding-right: 32px;">

    <!-- Info da seleção -->
    <div class="info-bar">
        <div class="d-flex gap-4 flex-wrap">
            <div class="info-item">
                <i class="bi bi-people-fill"></i>
                <strong th:text="${turmaSelecionada.nome}">Turma</strong>
            </div>
            <div class="info-item">
                <i class="bi bi-journal-bookmark-fill"></i>
                <strong th:text="${materiaSelecionada.nome}">Matéria</strong>
            </div>
            <div class="info-item">
                <i class="bi bi-calendar-check"></i>
                <span class="badge-info" th:text="${unidadeSelecionada} + 'ª Unidade'">Unidade</span>
            </div>
            <div class="info-item">
                <i class="bi bi-person-check-fill"></i>
                <span th:text="${#lists.size(alunos)} + ' aluno(s)'"></span>
            </div>
        </div>
        <a th:href="@{/notas/lancar}" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Trocar turma/matéria
        </a>
    </div>

    <!-- Barra de progresso -->
    <div class="progress-bar-container">
        <div class="progress-label">
            <span><i class="bi bi-check-circle-fill text-success"></i> Alunos com notas preenchidas</span>
            <span id="progressoTexto">0 de <span th:text="${#lists.size(alunos)}"></span></span>
        </div>
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
    </div>

    <!-- Formulário -->
    <form th:action="@{/notas/salvar-lote}" method="post" id="formLote">
        <input type="hidden" name="turmaId" th:value="${turmaId}">
        <input type="hidden" name="materiaId" th:value="${materiaId}">
        <input type="hidden" name="unidade" th:value="${unidadeSelecionada}">

        <div class="alunos-card" th:if="${!#lists.isEmpty(alunos)}">
            <!-- Cabeçalho -->
            <div class="aluno-row header">
                <div>#</div>
                <div>Aluno</div>
                <div class="text-center">Nota 1</div>
                <div class="text-center">Nota 2</div>
                <div class="text-center">Nota 3</div>
                <div class="text-center">Nota 4</div>
                <div class="text-center">Recuperação</div>
                <div class="text-center">Média</div>
            </div>

            <!-- Linhas de alunos -->
            <div th:each="aluno, iter : ${alunos}" class="aluno-row">
                <div class="aluno-numero" th:text="${iter.index + 1}" data-label="#">#</div>

                <div class="aluno-nome" data-label="Aluno">
                    <i class="bi bi-person-circle text-primary me-2"></i>
                    <span th:text="${aluno.nome}"></span>
                </div>

                <div data-label="Nota 1">
                    <input type="number" class="nota-input"
                           th:name="'nota_' + ${aluno.id} + '_1'"
                           th:value="${notasPorAluno.get(aluno.id) != null ? notasPorAluno.get(aluno.id).nota1 : ''}"
                           min="0" max="10" step="0.1"
                           oninput="marcarPreenchida(this); calcularMedia(this)">
                </div>
                <div data-label="Nota 2">
                    <input type="number" class="nota-input"
                           th:name="'nota_' + ${aluno.id} + '_2'"
                           th:value="${notasPorAluno.get(aluno.id) != null ? notasPorAluno.get(aluno.id).nota2 : ''}"
                           min="0" max="10" step="0.1"
                           oninput="marcarPreenchida(this); calcularMedia(this)">
                </div>
                <div data-label="Nota 3">
                    <input type="number" class="nota-input"
                           th:name="'nota_' + ${aluno.id} + '_3'"
                           th:value="${notasPorAluno.get(aluno.id) != null ? notasPorAluno.get(aluno.id).nota3 : ''}"
                           min="0" max="10" step="0.1"
                           oninput="marcarPreenchida(this); calcularMedia(this)">
                </div>
                <div data-label="Nota 4">
                    <input type="number" class="nota-input"
                           th:name="'nota_' + ${aluno.id} + '_4'"
                           th:value="${notasPorAluno.get(aluno.id) != null ? notasPorAluno.get(aluno.id).nota4 : ''}"
                           min="0" max="10" step="0.1"
                           oninput="marcarPreenchida(this); calcularMedia(this)">
                </div>
                <div data-label="Recuperação">
                    <input type="number" class="nota-input recuperacao"
                           th:name="'nota_' + ${aluno.id} + '_rec'"
                           th:value="${notasPorAluno.get(aluno.id) != null ? notasPorAluno.get(aluno.id).recuperacao : ''}"
                           min="0" max="10" step="0.1"
                           placeholder="opcional"
                           oninput="marcarPreenchida(this); calcularMedia(this)">
                </div>
                <div data-label="Média">
                    <span class="media-badge" th:id="'media_' + ${aluno.id}">-</span>
                </div>
            </div>
        </div>

        <!-- Estado vazio -->
        <div th:if="${#lists.isEmpty(alunos)}" class="alunos-card">
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <h4>Nenhum aluno nesta turma</h4>
                <p>Cadastre alunos e vincule-os à turma.</p>
                <a href="/alunos" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Cadastrar Alunos
                </a>
            </div>
        </div>

        <!-- Botão flutuante salvar -->
        <button type="submit" class="btn-floating" th:if="${!#lists.isEmpty(alunos)}"
                onclick="return confirm('Salvar as notas de todos os alunos preenchidos?')">
            <i class="bi bi-save"></i> Salvar Notas
        </button>
    </form>
</div>

<div th:replace="~{fragments/navbar :: toast}"></div>
<script th:replace="~{fragments/navbar :: scriptToast}"></script>

<script>
    // Marca o campo com cor de "preenchido"
    function marcarPreenchida(input) {
        if (input.value && input.value.trim() !== '') {
            input.classList.add('preenchida');
        } else {
            input.classList.remove('preenchida');
        }
        atualizarProgresso();
    }

    // Calcula a média da linha do aluno
    function calcularMedia(input) {
        const row = input.closest('.aluno-row');
        if (!row) return;

        const inputs = row.querySelectorAll('.nota-input:not(.recuperacao)');
        let soma = 0, count = 0;
        inputs.forEach(inp => {
            const v = parseFloat(inp.value);
            if (!isNaN(v)) { soma += v; count++; }
        });

        const recInput = row.querySelector('.nota-input.recuperacao');
        const rec = parseFloat(recInput?.value);

        let media = null;
        if (count > 0) media = soma / count;
        if (!isNaN(rec) && rec > media) media = rec;

        const badge = row.querySelector('.media-badge');
        if (media !== null) {
            badge.textContent = media.toFixed(1);
            badge.classList.remove('aprovado', 'reprovado');
            if (media >= 6) badge.classList.add('aprovado');
            else badge.classList.add('reprovado');
        } else {
            badge.textContent = '-';
            badge.classList.remove('aprovado', 'reprovado');
        }
    }

    // Atualiza a barra de progresso
    function atualizarProgresso() {
        const totalAlunos = document.querySelectorAll('.aluno-row:not(.header)').length;
        let preenchidos = 0;

        document.querySelectorAll('.aluno-row:not(.header)').forEach(row => {
            const inputs = row.querySelectorAll('.nota-input:not(.recuperacao)');
            let temAlgum = false;
            inputs.forEach(inp => {
                if (inp.value && inp.value.trim() !== '') temAlgum = true;
            });
            if (temAlgum) preenchidos++;
        });

        const pct = totalAlunos > 0 ? (preenchidos / totalAlunos * 100) : 0;
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressoTexto').innerHTML = preenchidos + ' de ' + totalAlunos;
    }

    // Calcula médias já existentes ao carregar a página
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.nota-input').forEach(inp => {
            if (inp.value && inp.value.trim() !== '') {
                inp.classList.add('preenchida');
            }
            calcularMedia(inp);
        });
        atualizarProgresso();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
