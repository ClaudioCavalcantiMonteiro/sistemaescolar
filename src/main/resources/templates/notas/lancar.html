<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lançar Notas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home"><i class="bi bi-mortarboard"></i> Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/series">Séries</a></li>
                <li class="nav-item"><a class="nav-link" href="/materias">Matérias</a></li>
                <li class="nav-item"><a class="nav-link" href="/turmas">Turmas</a></li>
                <li class="nav-item"><a class="nav-link" href="/alunos">Alunos</a></li>
                <li class="nav-item"><a class="nav-link active" href="/notas/lancar">Lançar Notas</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Conteúdo principal -->
<div class="container mt-4">
    <h1>Lançar Notas</h1>
    <div th:if="${param.sucesso}" class="alert alert-success">Nota salva com sucesso!</div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/notas/salvar}" method="post">
                <!-- Filtro por turma -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Filtrar por Turma</label>
                        <select class="form-select" id="turmaSelect" onchange="filtrarPorTurma()">
                            <option value="">Todas as turmas</option>
                            <option th:each="turma : ${turmas}" th:value="${turma.id}" th:text="${turma.nome}" th:selected="${turma.id == turmaId}"></option>
                        </select>
                    </div>
                </div>

                <!-- Campos do formulário -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Aluno</label>
                        <select class="form-select" name="aluno.id" required>
                            <option value="">Selecione</option>
                            <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Matéria</label>
                        <select class="form-select" name="materia.id" required>
                            <option value="">Selecione</option>
                            <option th:each="materia : ${materias}" th:value="${materia.id}" th:text="${materia.nome}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Unidade</label>
                        <select class="form-select" name="unidade" required>
                            <option value="1">1ª Unidade</option>
                            <option value="2">2ª Unidade</option>
                            <option value="3">3ª Unidade</option>
                            <option value="4">4ª Unidade</option>
                        </select>
                    </div>
                </div>

                <!-- Notas -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Nota 1</label>
                        <input type="number" class="form-control" step="0.1" min="0" max="10" name="nota1">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nota 2</label>
                        <input type="number" class="form-control" step="0.1" min="0" max="10" name="nota2">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nota 3</label>
                        <input type="number" class="form-control" step="0.1" min="0" max="10" name="nota3">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nota 4</label>
                        <input type="number" class="form-control" step="0.1" min="0" max="10" name="nota4">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Recuperação (opcional)</label>
                        <input type="number" class="form-control" step="0.1" min="0" max="10" name="recuperacao">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar Nota</button>
                <a href="/home" class="btn btn-secondary">Voltar</a>
            </form>

            <!-- Botão listar alunos da turma -->
            <div th:if="${turmaId != null}" class="mt-3">
                <a th:href="@{/notas/turma/{id}(id=${turmaId})}" class="btn btn-info">
                    <i class="bi bi-list-ul"></i> Listar Alunos da Turma com Notas
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Script para filtro de turma -->
<script>
    function filtrarPorTurma() {
        var turmaId = document.getElementById('turmaSelect').value;
        var url = '/notas/lancar';
        if (turmaId) {
            url += '?turmaId=' + turmaId;
        }
        window.location.href = url;
    }
</script>

<!-- Bootstrap JS (opcional, mas necessário para alguns componentes) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
