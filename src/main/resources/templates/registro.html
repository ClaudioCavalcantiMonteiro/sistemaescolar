<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            max-width: 440px;
            width: 100%;
            border-radius: 1.5rem;
            border: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .register-card .card-body {
            padding: 2.5rem;
        }
        .register-card .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
        }
        .register-card .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        .register-card .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
        }
        .register-card .btn-primary:hover {
            background-color: #4338ca;
            border-color: #4338ca;
        }
        .register-card .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .register-card .brand h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #1e293b;
        }
        .register-card .brand h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4f46e5;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .register-card h3 {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }
        .register-card .input-group-text {
            background: transparent;
            border: 0;
            padding: 0 0 0 1rem;
        }
        .register-card .input-group .form-control {
            border-left: 0;
        }
        .register-card .input-group:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        .register-card .form-check-input:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .register-card .form-check-label {
            font-size: 0.9rem;
            color: #334155;
        }
        .register-card .login-link {
            text-align: center;
            margin-top: 1rem;
        }
        .register-card .login-link a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }
        .register-card .login-link a:hover {
            text-decoration: underline;
        }
        .register-card .feedback.error {
            color: #dc2626;
            text-align: center;
            margin-top: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-4">
            <div class="card register-card">
                <div class="card-body">
                    <div class="brand">
                        <h1>SISTEMA ESCOLAR</h1>
                        <h2>LOGIN</h2>
                    </div>
                    <h3>Criar uma conta</h3>

                    <form action="/registro" method="post">
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Seu nome</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Seu endereço de email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu email" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label fw-semibold">Sua senha</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha" required>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="termos" name="termos" required>
                            <label class="form-check-label" for="termos">Concordo com os Termos e Condições.</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </form>

                    <div class="login-link">
                        <a href="/login">Já tenho uma conta</a>
                    </div>

                    <div th:if="${param.erro}" class="feedback error">
                        <i class="bi bi-exclamation-circle"></i> Ocorreu um erro. Tente novamente.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
